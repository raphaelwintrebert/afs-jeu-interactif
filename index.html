    <script>
        const storyData = {
          "start": {
            "text": "Créée en 1914-1915 par <a href='https://fr.wikipedia.org/wiki/A._Piatt_Andrew' target='_blank'>A. Piatt Andrew</a>, l'American Ambulance Field Service était d'abord un corps d'ambulanciers volontaires états-uniens secourant les blessés en France lors de la Première Guerre mondiale.<br><br>Devenue l'<a href='https://afs.fr/a-propos-dafs/notre-histoire/' target='_blank'>American Field Service</a> (AFS), l'association crée en 1919 des <b>bourses universitaires franco-américaines</b> pour forger des relations pacifiques.<br><br>Relancée lors de la Seconde Guerre mondiale par Stephen Galatti, AFS œuvre aux côtés des alliés. Ils soutiennent les militaires à <a href='https://fr.wikipedia.org/wiki/Bataille_de_Bir_Hakeim' target='_blank'>Bir Hakeim</a> en 1942 ou encore participent à l'évacuation du <b>camp de concentration de Bergen-Belsen</b> en 1945.<br><br>Convaincus que les conflits naissent de l'ignorance de l'autre, Galatti et les anciens conducteurs décident dès 1946 de transformer cette fraternité de guerre en un <b>outil de paix durable</b>, grâce à un <b><a href='https://www.afs.fr' target='_blank'>programme novateur d'échange scolaire international.</a></b><br><br>Aujourd'hui, AFS est le réseau <b>leader mondial de l’immersion linguistique et interculturelle</b>.",
            "choices": [ { "text": "Continuer vers le quiz", "next": "quiz_1", "link_text": "" } ],
            "conclusive": false, "has_menu_button": false
          },
          "quiz_1": {
            "text": "<b>Question 1 : Quelle était la mission première des volontaires d'AFS lors de sa création en 1914 ?</b>",

              { "text": "1. Enseigner l'anglais dans les écoles françaises.", "next": "quiz_1_wrong", "link_text": "" },

              { "text": "3. Distribuer des vivres aux populations.", "next": "quiz_1_wrong", "link_text": "" }
            ],
            "conclusive": false, "has_menu_button": false
          },
          "quiz_1_wrong": {
            "text": "❌ <b>Mauvaise réponse.</b><br><br>Réponse correcte : 2. AFS est né comme un corps de conducteurs d'ambulances.",
            "choices": [ { "text": "Passer à la Question 2", "next": "quiz_2", "link_text": "" } ],
            "conclusive": false, "has_menu_button": false
          },
          "quiz_2": {
            "text": "<b>Question 2 : Pourquoi l'organisation a-t-elle changé de mission en 1947 ?</b>",
            "choices": [
              { "text": "1. Pour devenir une agence de voyage.", "next": "quiz_2_wrong", "link_text": "" },
              { "text": "2. À cause d'une interdiction gouvernementale.", "next": "quiz_2_wrong", "link_text": "" },
              { "text": "3. Pour promouvoir la paix mondiale à travers la compréhension mutuelle.", "next": "avant_propos", "link_text": "" }
            ],
            "conclusive": false, "has_menu_button": false
          },
          "quiz_2_wrong": {
            "text": "❌ <b>Mauvaise réponse.</b><br><br>Réponse correcte : 3. Transformer l'amitié de guerre en levier de paix.",
            "choices": [ { "text": "Continuer vers l'Avant-propos", "next": "avant_propos", "link_text": "" } ],
            "conclusive": false, "has_menu_button": false
          },
          "avant_propos": {
             "text": "<h3 style='color: #FF7900; margin-top: 0;'>Règles du jeu</h3>Vous vous apprêtez à ouvrir un dossier d'archives hors du commun. Ce jeu n'est pas linéaire : <b>vous allez en être le protagoniste principal.</b><br> À chaque carrefour, c'est votre jugement qui décidera de votre survie.<br><br>Pour jouer, munissez-vous d'un <b>carnet de bord</b>, et gardez votre smartphone à portée de main.<br>Certaines portes ne s'ouvriront que si vous tapez le code exact en effectuant des recherches sur l'histoire d'AFS.<br><br><b>Certaines erreurs seront fatales</b>, il vous faudra recommencer l'intrigue depuis le début. D'autres choix malencontreux vous feront perdre des points. Vous avez 100 pts au début et perdrez 20 pts par chemin non pertinent. A 0 pt, vous aurez perdu et devrez recommencer l'intrigue.<br><br><h3 style='color: #FF7900; margin-top: 0;'><br>Une précision sur les personnages réels</h3>Certaines figures historiques (notamment Stephen Galatti) apparaissent avec des dialogues imaginés à des fins pédagogiques.<br><br>Les faits biographiques utilisés comme énigmes ont en revanche été vérifiés.",

            "choices": [ { "text": "Lire les règles d'or d'AFS", "next": "regles_dor", "link_text": "" } ],
            "conclusive": false, "has_menu_button": false
          },
          "regles_dor": {
            "text": "<h3 style='color: #FF7900; margin-top: 0;'>1. SÉPARER L'OBSERVATION DE L'INTERPRÉTATION</h3>Quand tu rencontres un comportement qui te surprend, ne suppose pas immédiatement ce qu'il signifie. Observe d'abord. Demande avant de juger. La même action peut signifier dix choses différentes selon la culture. L'arrogance naît de l'interprétation hâtive.<br><br><br><h3 style='color: #FF7900; margin-top: 0;'>2. LA COMMUNICATION INTERCULTURELLE PRIME</h3>Dans le doute, communique. Pose des questions. Explique ton point de vue. Les malentendus naissent du silence. Les amitiés durables naissent du dialogue. Tu n'as pas besoin de parfaitement comprendre. Mais tu as besoin d'essayer.<br><br><br><h3 style='color: #FF7900; margin-top: 0;'>3. ACCEPTER LES DIFFÉRENCES</h3>Si tu voyages uniquement pour trouver des gens comme toi, tu as raté le voyage. L'échange est une chance de te redéfinir toi-même à travers le regard de l'autre. Tu reviendras différent. Ce n'est pas une menace. C'est une transformation.<br><br><br><h3 style='color: #FF7900; margin-top: 0;'>4. LES ÉPREUVES SONT DES OCCASIONS D'APPRENTISSAGE</h3>Ce jeu te confronte à des moments où tu devras apprendre rapidement. Certaines leçons te changeront. D'autres te dérouteront. Mais chaque choix est une opportunité d'apprendre—pas seulement sur le monde, mais sur toi-même.<br><br><br><h3 style='color: #FF7900; margin-top: 0;'>5. VIOLENCES SEXUELLES ET SEXISTES (VSS)</h3>Être vigilant par rapport aux risques de VSS, et <b>en parler immédiatement</b> à un bénévole ou un staff AFS en cas de doute ou comportement inapproprié.<br><br><br><h3 style='color: #FF7900; margin-top: 0;'>6. OBLIGATIONS FORMELLES AFS</h3><b>Il est interdit de</b> :<br>* ne pas respecter les <b>lois</b> du pays d'accueil ; <br>* conduire tout véhicule <b>motorisé</b> (voiture, scooter, moto, bateau, quad, ULM, avion, kart, etc.) exigeant un permis conformément à la législation locale ; <br>* pratiquer l'<b>auto-stop</b> ; <br>* consommer ou vendre de la <b>drogue</b> (avec risque réel de peines d'emprisonnement) ; <br>* abuser de boissons <b>alcoolisées</b> ; <br>* ne pas respecter les <b>exigences scolaires</b>. Le non-respect ou la violation des règles du lycée (absences injustifiées ; manquement fréquent aux devoirs, problèmes de comportement, etc.) peuvent conduire à une <b>exclusion</b> de l'école.<br><br><i>Ces pratiques entraînent l'interruption immédiate du programme AFS et donc un <b>retour anticipé</b> dans le pays d'origine.</i>",

            "choices": [ { "text": "J'ai lu et compris. Commencer le jeu !", "next": "menu", "link_text": "" } ],
            "conclusive": false, "has_menu_button": false

eight: bold;'>[Galerie] Affiches de recrutement pour devenir ambulancier AFS lors de la Première Guerre mondiale</a></li><li><a href='#' onclick='renderChapter("archives_affiches"); return false;' style='color: black; font-weight: bold;'>[Galerie] Affiches des programmes de mobilité (AFS France)</a></li></ul><h4 style='color: #FF7900; margin-bottom: 5px;'>Les anciens logos AFS</h4><ul style='margin-top: 0;'><li><a href='#' onclick='renderChapter("archives_logos"); return false;' style='color: black; font-weight: bold;'>[Galerie] Explorer les différents logos AFS</a></li></ul>`,
            "choices": [],
            "conclusive": false,
            "has_menu_button": true
          },
          "archives_entre_deux_guerres": {
            "text": `<h3 style='color: #FF7900; margin-top: 0;'>AFS durant l'entre-deux-guerres (1918-1939)</h3><p style='text-align: center; font-style: italic; margin-bottom: 15px;'>Cliquez sur une image ou un document pour l'agrandir.</p><div style='display: flex; flex-wrap: wrap; gap: 25px; justify-content: center; align-items: flex-start;'><div style='display: flex; flex-direction: column; align-items: center; max-width: 280px; text-align: center;'><a href='Entre2G AFS Fellowships - Pamphlet.pdf' target='_blank' style='height: 250px; width: 200px; background-color: #f5f5f5; border-radius: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: black; font-weight: bold; padding: 15px; box-sizing: border-box;'><span style='font-size: 3em; margin-bottom: 10px;'>📄</span>AFS Fellowships<br>(Pamphlet)</a><span style='font-size: 13px; font-style: italic; color: #555; margin-top: 8px;'>Brochure officielle des bourses</span></div><div style='display: flex; flex-direction: column; align-items: center; max-width: 280px; text-align: center;'><a href='Entre2G 1920 Pierre Lepaulle à Harvard.jpg' target='_blank'><img src='Entre2G 1920 Pierre Lepaulle à Harvard.jpg' style='height: 250px; border-radius: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);'></a><span style='font-size: 13px; font-style: italic; color: #555; margin-top: 8px;'>Pierre Lepaulle a bénéficié d'une des premières bourses « AFS Fellowship » pour partir étudier à Harvard en 1920</span></div><div style='display: flex; flex-direction: column; align-items: center; max-width: 280px; text-align: center;'><a href='Entre2G 1920-05-08 AFS Reunion Dinner Hotel Pennsylvania NY.jpg' target='_blank'><img src='Entre2G 1920-05-08 AFS Reunion Dinner Hotel Pennsylvania NY.jpg' style='height: 250px; border-radius: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);'></a><span style='font-size: 13px; font-style: italic; color: #555; margin-top: 8px;'>Dîner des ambulanciers AFS à l'hôtel Pennsylvania de New-York le 8 mai 1920</span></div><div style='display: flex; flex-direction: column; align-items: center; max-width: 280px; text-align: center;'><a href='Entre2G 1921-12-01 AFS Fellowships for French Universities.jpg' target='_blank'><img src='Entre2G 1921-12-01 AFS Fellowships for French Universities.jpg' style='height: 250px; border-radius: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);'></a><span style='font-size: 13px; font-style: italic; color: #555; margin-top: 8px;'>Présentation en 1921 des « AFS Fellowships for French Universities »</span></div><div style='display: flex; flex-direction: column; align-items: center; max-width: 280px; text-align: center;'><a href='Entre2G 1921-12-03 AFS Association at the Mouquin Restaurant (NY).jpg' target='_blank'><img src='Entre2G 1921-12-03 AFS Association at the Mouquin Restaurant (NY).jpg' style='height: 250px; border-radius: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);'></a><span style='font-size: 13px; font-style: italic; color: #555; margin-top: 8px;'>Réunion des ambulanciers AFS au restaurant Mouquin de New-York, le 3 décembre 1921</span></div><div style='display: flex; flex-direction: column; align-items: center; max-width: 280px; text-align: center;'><a href='Entre2G 1921-94-30 AFS Second Annual Reunion Banquet.jpg' target='_blank'><img src='Entre2G 1921-94-30 AFS Second Annual Reunion Banquet.jpg' style='height: 250px; border-radius: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);'></a><span style='font-size: 13px; font-style: italic; color: #555; margin-top: 8px;'>Second banquet annuel des ambulanciers AFS le 30 avril 1921</span></div><div style='display: flex; flex-direction: column; align-items: center; max-width: 280px; text-align: center;'><a href='Entre2G 1925 AFS Brochure for AFS pilgrimage to France.jpg' target='_blank'><img src='Entre2G 1925 AFS Brochure for AFS pilgrimage to France.jpg' style='height: 250px; border-radius: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);'></a><span style='font-size: 13px; font-style: italic; color: #555; margin-top: 8px;'>Affichage proposant un « pèlerinage » AFS en France en août 1925</span></div><div style='display: flex; flex-direction: column; align-items: center; max-width: 280px; text-align: center;'><a href='Entre2G 1935-10-12 AFS Reunion at the Bitmore (New York).jpg' target='_blank'><img src='Entre2G 1935-10-12 AFS Reunion at the Bitmore (New York).jpg' style='height: 250px; border-radius: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);'></a><span style='font-size: 13px; font-style: italic; color: #555; margin-top: 8px;'>Réunion des ambulanciers AFS au Biltmore de New York, le 12 octobre 1935</span></div><div style='display: flex; flex-direction: column; align-items: center; max-width: 280px; text-align: center;'><a href='Entre2G Rock  The Fellowships for French Universities.doc' target='_blank' style='height: 250px; width: 200px; background-color: #f5f5f5; border-radius: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: black; font-weight: bold; padding: 15px; box-sizing: border-box;'><span style='font-size: 3em; margin-bottom: 10px;'>📄</span>Fellowships for French Univ.<br>(Doc)</a><span style='font-size: 13px; font-style: italic; color: #555; margin-top: 8px;'>George Rock, <i>History of the American Field Service 1920-1955</i>, The Platen Press, New-York, 1956.</span></div></div>`,

 "archives_fondateurs": {
            "text": `<h3 style='color: #FF7900; margin-top: 0;'>Les fondateurs d'AFS</h3><p style='text-align: center; font-style: italic; margin-bottom: 15px;'>Cliquez sur une image ou un document pour l'agrandir.</p><div style='display: flex; flex-wrap: wrap; gap: 35px; justify-content: center; align-items: flex-start;'>

            "choices": [

          "archives_logos": {
            "text": `<h3 style='color: #FF7900; margin-top: 0;'>Logos AFS</h3><p style='text-align: center; font-style: italic; margin-bottom: 15px;'>Cliquez sur un logo pour l'agrandir.</p><div style='display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: center; background-color: #f5f5f5; padding: 20px; border-radius: 8px;'><a href='Logo AFS INT 1947.png' target='_blank'><img src='Logo AFS INT 1947.png' style='height: 150px;'></a><a href='Logo AFS INT 1969.png' target='_blank'><img src='Logo AFS INT 1969.png' style='height: 150px;'></a><a href='Logo AFS INT 1972.png' target='_blank'><img src='Logo AFS INT 1972.png' style='height: 150px;'></a><a href='Logo AFS INT 1976.png' target='_blank'><img src='Logo AFS INT 1976.png' style='height: 150px;'></a><a href='Logo AFS INT 1987.png' target='_blank'><img src='Logo AFS INT 1987.png' style='height: 150px;'></a><a href='Logo AFS INT 1998.png' target='_blank'><img src='Logo AFS INT 1998.png' style='height: 150px;'></a><a href='Logos AFS INT.gif' target='_blank'><img src='Logos AFS INT.gif' style='height: 150px;'></a><video src='Logos AFS INT Animated.mp4' controls loop muted style='height: 150px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);'></video></div>`,

          "menu": {
            "text": `<h3 style='color: #FF7900; margin-top: 0; text-align: center;'>🌍 À LA CROISÉE DES MONDES</h3><p style='margin-bottom: 30px; text-align: center;'>Bienvenue dans les archives secrètes d'AFS Vivre Sans Frontière. <b>Six époques. Six destins. Six énigmes</b> à résoudre à travers le temps.<br><br>Choisissez votre dossier pour commencer l'aventure :</p><div style='display: flex; flex-wrap: wrap; gap: 30px; align-items: stretch;'><div style='flex: 1; min-width: 250px; background-color: #f5f5f5; padding: 20px; border-radius: 8px; border-left: 5px solid #FF7900; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; margin: 0;'><h3 style='color: #FF7900; margin-top: 0;'>Salle des archives</h3><p style='font-size: 14px; margin-bottom: 20px;'>Visitez la salle des archives secrètes AFS (photos, vidéos et documents historiques).</p><a href='#' onclick='renderChapter("archives"); return false;' style='background-color: #FF7900; color: white; padding: 12px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; width: 100%; box-sizing: border-box; display: inline-block;'>→ Consulter les archives</a></div><div style='flex: 2; min-width: 300px; display: flex; flex-direction: column; margin: 0;'><button onclick='renderChapter(84);' class='menu-button' style='width: 100%; margin: 0 0 10px 0; text-align: left; padding: 15px; font-size: 16px; cursor: pointer; border-radius: 8px; border: 1px solid #ccc; background-color: white;'>→ Dossier 1 : Le volontaire de la rue Raynouard (Paris, 1916)</button><button onclick='renderChapter(27);' class='menu-button' style='width: 100%; margin: 0 0 10px 0; text-align: left; padding: 15px; font-size: 16px; cursor: pointer; border-radius: 8px; border: 1px solid #ccc; background-color: white;'>→ Dossier 2 : Le testament d'Arthur Foster (Méditerranée, 1945)</button><button onclick='renderChapter(115);' class='menu-button' style='width: 100%; margin: 0 0 10px 0; text-align: left; padding: 15px; font-size: 16px; cursor: pointer; border-radius: 8px; border: 1px solid #ccc; background-color: white;'>→ Dossier 3 : L'esprit cartésien dans le Midwest (USA, 1964)</button><button onclick='renderChapter(42);' class='menu-button' style='width: 100%; margin: 0 0 10px 0; text-align: left; padding: 15px; font-size: 16px; cursor: pointer; border-radius: 8px; border: 1px solid #ccc; background-color: white;'>→ Dossier 4 : La disparue de Salvador (Bahia, 1977)</button><button onclick='renderChapter(9);' class='menu-button' style='width: 100%; margin: 0 0 10px 0; text-align: left; padding: 15px; font-size: 16px; cursor: pointer; border-radius: 8px; border: 1px solid #ccc; background-color: white;'>→ Dossier 5 : Le Pounamu de l'ambulancier (Wellington, 2005)</button><button onclick='renderChapter(63);' class='menu-button' style='width: 100%; margin: 0; text-align: left; padding: 15px; font-size: 16px; cursor: pointer; border-radius: 8px; border: 1px solid #ccc; background-color: white;'>→ Dossier 6 : L'écho du Bataclan (Paris, 2016)</button></div></div>`,

	  /* ================================================================= */
          /* INTRIGUE 1 : LE VOLONTAIRE DE LA RUE RAYNOUARD (PARIS, 1916) (59 CHAPITRES)      */
          /* ================================================================= */

 "84": {
            "text": "Le bourdonnement de l'activité est incessant au 21 rue Raynouard, dans le 16e arrondissement de Paris.<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 84. Maison de la rue Raynouard.jpg\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">QG de l'AFS au 21 rue de la rue Raynouard, Paris, 16e</span></div>En ce printemps 1917, le domaine de l'American Field Service (AFS) ressemble à une ruche en pleine effervescence.<br><br>Tu t'appelles Pierre, tu as 18 ans, et tu es engagé comme planton au quartier général de l'AFS. Aujourd'hui, l'ambiance est lourde de suspicion.<br><br>Un rapport secret de la section de transport sanitaire SSU 17 a disparu. Ce document contient les itinéraires de livraison de matériel pour les ambulances de la Section 8. Si ces plans tombent entre les mains de l'armée allemande, le convoi sera détruit.<br><br>Guidé par ton instinct, tu pénètres dans le bureau de Stephen Galatti pour faire ton rapport. Devant toi se dresse un bureau dans un désordre titanesque. Galatti, téléphone à l'oreille, griffonne des notes.<br><br>Soudain, tu remarques un télégramme froissé, rédigé en allemand, glissé sous un encrier. Tu n'as que quelques secondes pour agir avant qu'il ne raccroche.",
            "choices": [
              { "text": "Tu t'empares discrètement du télégramme pour l'apporter à Allan H. Muhr en bas.", "next": 41, "link_text": "→ Chapitre 41" },
              { "text": "Tu attends que Galatti termine son appel pour l'interroger directement.", "next": 58, "link_text": "→ Chapitre 58" },
              { "text": "Tu quittes le bureau pour interroger Mme Grimbert, la secrétaire, sur les visiteurs.", "next": 117, "link_text": "→ Chapitre 117" }
            ],
            "conclusive": false, "has_menu_button": true
          },

"117": {
            "text": "Tu te diriges vers l'accueil pour interroger Mme Grimbert. Tu la trouves en pleine discussion avec Jeanne, une autre bénévole.<br><br>Tu sais que le temps presse et que la vie des ambulanciers est en jeu. Mais tu sais aussi que la communication interculturelle française exige un certain formalisme.",
            "choices": [
              { "text": "Tu l'interromps brusquement d'un ton autoritaire en rappelant l'urgence militaire.", "next": 81, "link_text": "→ Chapitre 81" },
              { "text": "Tu t'excuses immédiatement pour ton interruption et reformules avec une extrême politesse.", "next": 142, "link_text": "→ Chapitre 142" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "81": {
            "text": "❌ IMPASSE : Mme Grimbert se redresse, offensée par ton ton direct et impoli. Pour elle, ton attitude est un manque de respect total. Elle refuse de coopérer et signale ton comportement agressif à la sécurité. Tu es consigné dans ta chambre, ruinant ton enquête.",
            "choices": [ { "text": "La politesse est une arme. Utilise ton Check-point pour revoir ton approche.", "next": 84, "link_text": "→ Retour au Chapitre 84" } ],
            "conclusive": false, "has_menu_button": true
          },

          "142": {
            "text": "Sensible à tes bonnes manières et à ton ton posé, le visage de Mme Grimbert s'adoucit. <br><br>« Je vous pardonne, Pierre. En fait, un homme en habit de mécanicien est venu très tôt ce matin. Il prétendait être envoyé par l'atelier pour récupérer les fiches de la Section 8. Mais il s'est dirigé vers le bosquet du domaine, là où Peter Kent décharge les châssis. D'autres m'ont dit qu'il serait reparti vers nos ateliers de la rue Pinel. »",
            "choices": [
              { "text": "Tu décides d'aller fouiller le bosquet de Raynouard pour chercher ce mécanicien.", "next": 184, "link_text": "→ Chapitre 184" },
              { "text": "Tu décides de filer directement aux ateliers de carrosserie de la rue Pinel.", "next": 163, "link_text": "→ Chapitre 163" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "184": {
            "text": "Tu te rends dans le bosquet où les châssis de Ford T sont alignés. Tu aperçois Peter Kent, de dos. Mais près d'une ambulance isolée, un homme en salopette est penché sous le capot. En l'observant attentivement, tu remarques qu'il essaie de dissimuler une petite fiole de verre dans sa veste.",
            "choices": [
              { "text": "Tu te jettes sur lui pour le plaquer au sol brutalement.", "next": 205, "link_text": "→ Chapitre 205" },
              { "text": "Tu alertes discrètement Peter Kent pour l'encercler calmement.", "next": 227, "link_text": "→ Chapitre 227" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "205": {
            "text": "❌ IMPASSE : Dans la pénombre, tu te jettes sur l'homme. Peter Kent accourt... et te sépare violemment. L'homme n'était pas un espion, mais Denny, le chef mécanicien ! Ton agression injustifiée te vaut une expulsion immédiate.",
            "choices": [ { "text": "L'observation précède l'action. Utilise ton Check-point.", "next": 142, "link_text": "→ Retour au Chapitre 142" } ],
            "conclusive": false, "has_menu_button": true
          },

          "227": {
            "text": "Avec l'aide de Peter Kent, l'homme est coincé et maîtrisé sans violence. Dans ses poches, vous trouvez la fiole : c'est de l'acide pour saboter les freins ! <br><br>Amené devant Galatti, le saboteur lâche un rire glacial. « Vous m'avez eu, les Américains. Mais je ne suis qu'une diversion. Le vrai vol des plans d'état-major a lieu en ce moment même... »",
            "choices": [ 
              { "text": "Tu l'écoutes attentivement pour savoir où se passe le vrai vol.", "next": 391, "link_text": "→ Chapitre 391" },
              { "text": "Tu refuses de l'écouter, le bâillonnes et le livres à la police militaire.", "next": 241, "link_text": "→ Chapitre 241" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "241": {
            "text": "❌ IMPASSE : En le faisant taire immédiatement, tu rates l'information cruciale. Le saboteur est emprisonné, mais la vraie taupe au front opère sans être inquiétée. L'offensive française est sabotée par manque d'informations.",
            "choices": [ { "text": "Écouter l'ennemi est parfois vital. Utilise ton Check-point.", "next": 227, "link_text": "→ Retour au Chapitre 227" } ],
            "conclusive": false, "has_menu_button": true
          },

          "163": {
            "text": "Tu arrives aux ateliers de carrosserie de la rue Pinel. Des dizaines d'ambulances sont alignées. L'endroit est immense et désert à cette heure matinale.<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 163. Mécanicien ambulance AFS.jpg\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Ambulance AFS</span></div>",
            "choices": [
              { "text": "Tu t'enfonces seul dans les hangars sombres pour inspecter les stocks.", "next": 275, "link_text": "→ Chapitre 275" },
              { "text": "Tu vas frapper au bureau vitré du Maréchal des logis pour l'interroger.", "next": 311, "link_text": "→ Chapitre 311" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "275": {
            "text": "❌ IMPASSE : Tu pénètres dans le hangar. Soudain, la lourde porte en chêne se referme violemment derrière toi. Le verrou claque. Tu es enfermé dans le noir absolu par le saboteur qui t'avait repéré. Tu y resteras toute la journée.",
            "choices": [ { "text": "L'isolement est dangereux. Utilise ton Check-point.", "next": 163, "link_text": "→ Retour au Chapitre 163" } ],
            "conclusive": false, "has_menu_button": true
          },

          "311": {
            "text": "Le Maréchal des logis consulte son registre d'encre noire : « Le convoi de la Section 8 est bien parti par camion il y a vingt minutes. Mais le chauffeur n'avait pas son insigne de l'AFS. Il a dit l'avoir oublié... J'ai un doute. Il a pris la route du Nord. »",
            "choices": [ 
              { "text": "Tu réquisitionnes une voiture de liaison pour poursuivre le camion.", "next": 334, "link_text": "→ Chapitre 334" },
              { "text": "Tu doutes du Maréchal et exiges de fouiller ses registres personnels.", "next": 318, "link_text": "→ Chapitre 318" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "318": {
            "text": "❌ IMPASSE : Le Maréchal s'offusque de ton insubordination. Il appelle la sécurité pour te faire expulser de la rue Pinel. Pendant cette dispute inutile, le camion du saboteur s'échappe définitivement vers le Nord.",
            "choices": [ { "text": "Il faut faire confiance à ses alliés. Utilise ton Check-point.", "next": 311, "link_text": "→ Retour au Chapitre 311" } ],
            "conclusive": false, "has_menu_button": true
          },

          "334": {
            "text": "Tu roules à tombeau ouvert et repères le camion stationné sur le bas-côté, à la lisière d'un bois. Le chauffeur est en train de verser une substance dans le réservoir d'essence du véhicule !",
            "choices": [
              { "text": "Tu bondis hors de ta voiture pour le neutraliser immédiatement.", "next": 352, "link_text": "→ Chapitre 352" },
              { "text": "Tu hésites dans ta voiture, cherchant une arme.", "next": 379, "link_text": "→ Chapitre 379" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "379": {
            "text": "❌ IMPASSE : Ton hésitation lui laisse le temps de te repérer. Il jette son bidon, saute dans la cabine du camion et démarre en trombe. Tu as perdu sa trace dans la forêt de Chantilly.",
            "choices": [ { "text": "Le doute t'a paralysé. Utilise ton Check-point.", "next": 334, "link_text": "→ Retour au Chapitre 334" } ],
            "conclusive": false, "has_menu_button": true
          },

          "352": {
            "text": "Tu te jettes sur lui. L'effet de surprise joue en ta faveur, tu le maîtrises et le ligotes. Ramenant le saboteur à Paris, tu le livres à Galatti. <br><br>Lors de son interrogatoire, le saboteur ricane et lâche une information terrifiante...",
            "choices": [ 
              { "text": "Tu écoutes sa révélation jusqu'au bout.", "next": 391, "link_text": "→ Chapitre 391" },
              { "text": "Tu l'assommes pour le faire taire avant qu'il ne parle.", "next": 362, "link_text": "→ Chapitre 362" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "362": {
            "text": "❌ IMPASSE : En l'assommant sous le coup de la colère, tu l'empêches de révéler que la véritable cible est au Chemin des Dames. L'offensive française échouera lamentablement par ton manque de maîtrise.",
            "choices": [ { "text": "Le sang-froid est la force de l'AFS. Utilise ton Check-point.", "next": 352, "link_text": "→ Retour au Chapitre 352" } ],
            "conclusive": false, "has_menu_button": true
          },

          "58": {
            "text": "Tu attends en silence devant le bureau. Galatti raccroche et te sourit : « Oui Pierre ? » Tu lui fais part de tes craintes sur le dossier manquant.<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 58. Stephen Galatti à son bureau.png\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Stephen Galatti, directeur général de l'AFS dans son bureau de New-York dans les années 1960.</span></div>Galatti soupire : « Ma mémoire ne me trompe jamais. Un civil est venu hier. Si le dossier a été volé, c'est pour saboter le train d'approvisionnement de la Section 8 ce matin. »",
            "choices": [
              { "text": "Tu vas fouiller les malles des nouvelles recrues.", "next": 89, "link_text": "→ Chapitre 89" },
              { "text": "Tu lui demandes de consulter la fiche d'expédition du train.", "next": 256, "link_text": "→ Chapitre 256" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "89": {
            "text": "❌ IMPASSE : Ignorant la confiance de l'association, tu fouilles les malles des recrues.<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 89. Piatt & Galatti at 21 rue Raynouard 1917.jpg\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Andrew A. Piatt (fondateur d'AFS) et Stephen Galatti (son adjoint) en 1917</span></div>Tu es surpris par A. Piatt Andrew en personne ! Fouiller sans preuve viole le code d'honneur d'AFS. Tu es suspendu.",
            "choices": [ { "text": "La paranoïa est mauvaise conseillère. Utilise ton Check-point.", "next": 58, "link_text": "→ Retour au Chapitre 58" } ],
            "conclusive": false, "has_menu_button": true
          },

          "256": {
            "text": "Galatti feuillette son registre. « Le train part ce matin à 8h00. » Il te tend la fiche carbone, mais un fonctionnaire a mal tamponné le document, et le nom de la gare parisienne est illisible.",
            "choices": [ 
              { "text": "Tu analyses l'énigme de la gare pour déduire le lieu exact.", "next": 291, "link_text": "→ Chapitre 291" },
              { "text": "Tu déduis hâtivement qu'il s'agit de la Gare de l'Ouest (Montparnasse) et t'y précipites.", "next": 261, "link_text": "→ Chapitre 261" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "261": {
            "text": "❌ ÉCHEC : Tu arrives essoufflé à la Gare Montparnasse. Le chef de gare te rit au nez : « Mon gars, ici les trains partent pour la Bretagne, pas pour le front de l'Est ! » Tu as perdu un temps précieux, le saboteur s'est échappé.",
            "choices": [ { "text": "La précipitation mène à l'erreur. Utilise ton Check-point.", "next": 256, "link_text": "→ Retour au Chapitre 256" } ],
            "conclusive": false, "has_menu_button": true
          },

          "41": {
            "text": "Tu glisses le télégramme dans ta poche et cours le montrer à Allan H. Muhr, dans la cour.<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 41. Allan Henry Muhr.jpg\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Allan Henry Muhr, ambulancier AFS durant la Première Guerre mondiale</span></div>Il lit l'allemand : « C'est une alerte de sabotage pour le train de la Section 8 ce matin ! Mais la gare de départ est raturée sur ce brouillon ! »",
            "choices": [ 
              { "text": "Tu analyses l'énigme historique pour déduire la bonne gare.", "next": 291, "link_text": "→ Chapitre 291" },
              { "text": "Tu pars au hasard vers la Gare Montparnasse (Gare de l'Ouest) sans réfléchir.", "next": 43, "link_text": "→ Chapitre 43" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "43": {
            "text": "❌ ÉCHEC : Tu arrives essoufflé à la Gare Montparnasse. Le chef de gare te rit au nez : « Mon gars, ici les trains partent pour la Bretagne, pas pour le front de l'Est ! » Tu as perdu un temps précieux.",
            "choices": [ { "text": "Le hasard n'a pas sa place ici. Utilise ton Check-point.", "next": 41, "link_text": "→ Retour au Chapitre 41" } ],
            "conclusive": false, "has_menu_button": true
          },

          "291": {
            "text": "★ ÉNIGME HISTORIQUE ★<br><br>Faisant appel à tes connaissances géographiques de Paris et de la Première Guerre mondiale, de quelle grande gare parisienne un train militaire desservant le front Nord-Est (la Somme, l'Aisne) doit-il logiquement partir ?",
            "choices": [
              { "text": "Il doit s'agir de la Gare Montparnasse (Gare de l'Ouest).", "next": 73, "link_text": "→ Chapitre 73" },
              { "text": "Il doit s'agir de la Gare de l'Est.", "next": 104, "link_text": "→ Chapitre 104" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "73": {
            "text": "❌ IMPASSE : Tu as mal répondu à l'énigme. La Gare Montparnasse dessert l'Ouest de la France. Le temps de t'en rendre compte, le convoi a été saboté à l'autre bout de Paris.",
            "choices": [ { "text": "Utilise ton Check-point pour revoir ta géographie.", "next": 291, "link_text": "→ Retour à l'énigme" } ],
            "conclusive": false, "has_menu_button": true
          },

          "104": {
            "text": "Tu as vu juste ! Tu cours à perdre haleine et arrives sur les quais de la Gare de l'Est.<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 104. Gare de l'Est Paris 1916.jpg\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Gare de l'Est, Paris, 1916</span></div>À travers la fumée des locomotives, tu repères un homme en salopette bleue qui s'affaire autour des essieux du wagon de l'AFS. Il tient un détonateur à retardement !",
            "choices": [
              { "text": "Tu hurles pour l'interpeller depuis le bout du quai.", "next": 147, "link_text": "→ Chapitre 147" },
              { "text": "Tu observes, t'approches discrètement et alertes les gendarmes militaires.", "next": 368, "link_text": "→ Chapitre 368" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "147": {
            "text": "❌ IMPASSE : Tu jaillis en hurlant. Surpris par ton assaut brouillon, l'homme te jette sa lourde caisse à outils au visage, saute dans un train de charbon en marche et disparaît. Le convoi est compromis.",
            "choices": [ { "text": "La précipitation t'a trahi. Utilise ton Check-point.", "next": 104, "link_text": "→ Retour au Chapitre 104" } ],
            "conclusive": false, "has_menu_button": true
          },

          "368": {
            "text": "Tu restes calme. Tu alertes la patrouille de gendarmerie la plus proche. L'homme est encerclé et menotté avant d'avoir pu armer son détonateur. Tu as sauvé le train !<br><br>Amené au QG de la rue Raynouard, l'homme est interrogé par le contre-espionnage. Il lâche une information terrifiante...",
            "choices": [ 
              { "text": "Tu écoutes la révélation du prisonnier.", "next": 391, "link_text": "→ Chapitre 391" },
              { "text": "Tu ignores ses divagations et vas te coucher, fier de toi.", "next": 372, "link_text": "→ Chapitre 372" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "372": {
            "text": "❌ IMPASSE : Ton excès de confiance t'aveugle. En allant te coucher, tu rates la révélation prouvant que ce sabotage n'était qu'une diversion. La vraie attaque a lieu au front le lendemain.",
            "choices": [ { "text": "L'enquête ne s'arrête jamais. Utilise ton Check-point.", "next": 368, "link_text": "→ Retour au Chapitre 368" } ],
            "conclusive": false, "has_menu_button": true
          },

          "391": {
            "text": "L'espion éclate de rire : « Vous m'avez eu, les Américains ! Mais ce n'était qu'une diversion. Le vrai vol des plans d'état-major a lieu en ce moment même au nord, près de Soissons, pour anéantir votre Section 8 au Chemin des Dames ! »<br><br>Stephen Galatti se tourne vers toi, le visage blême. Les lignes téléphoniques avec le front sont coupées. « Pierre, l'offensive française est en danger. Tu vas devoir porter le message d'alerte toi-même. Rejoins le point de ralliement de Soissons en urgence. »",
            "choices": [ 
              { "text": "Tu acceptes la mission, prends ton paquetage et pars pour Soissons.", "next": 405, "link_text": "→ Chapitre 405" },
              { "text": "Tu refuses, estimant que c'est une mission trop dangereuse pour un civil.", "next": 395, "link_text": "→ Chapitre 395" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "395": {
            "text": "❌ IMPASSE : Tu refuses d'obéir par peur. Galatti, très déçu, envoie un autre volontaire qui, ne parlant pas français, se perd en route. L'offensive au Chemin des Dames se termine en désastre.",
            "choices": [ { "text": "Le courage est le propre de l'AFS. Utilise ton Check-point.", "next": 391, "link_text": "→ Retour au Chapitre 391" } ],
            "conclusive": false, "has_menu_button": true
          },

          "405": {
            "text": "Tu arrives à Soissons, à bord d'un camion de ravitaillement. La ville est un champ de ruines.<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 405. Rue Soissons.jpg\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Rue de Soissons. Damage to a building on Beffroi Street, Soissons, France</span></div>L'imposante cathédrale est éventrée par les obus. Galatti t'avait indiqué que l'officier de liaison t'attendrait au \"Café de la Paix\", près de la grand-place.",
            "choices": [
              { "text": "Tu cries dans les rues désertes pour appeler l'officier.", "next": 423, "link_text": "→ Chapitre 423" },
              { "text": "Tu fouilles silencieusement les décombres de la place.", "next": 418, "link_text": "→ Chapitre 418" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "423": {
            "text": "❌ IMPASSE : Tes cris résonnent dans les ruines... et attirent une patrouille allemande égarée. Tu es fait prisonnier de guerre avant même d'avoir pu livrer ton message. La Section 8 est condamnée.",
            "choices": [ { "text": "Le silence est d'or. Utilise ton Check-point.", "next": 405, "link_text": "→ Retour au Chapitre 405" } ],
            "conclusive": false, "has_menu_button": true
          },

          "418": {
            "text": "En fouillant les gravats de l'ancien café, tu découvres le corps sans vie de l'officier de liaison. Dans sa main raidie, il serre une carte d'état-major ensanglantée. L'itinéraire pointe vers un Poste de Secours Avancé (RAP) situé directement sur la ligne du Chemin des Dames.<br><br>Une ambulance Ford T, moteur encore chaud, est garée à l'arrière du café.",
            "choices": [ 
              { "text": "Tu prends le volant de la Ford T pour accomplir la mission.", "next": 429, "link_text": "→ Chapitre 429" },
              { "text": "Tu restes près du corps pour attendre les renforts militaires.", "next": 425, "link_text": "→ Chapitre 425" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "425": {
            "text": "❌ IMPASSE : En restant sur place, tu deviens une cible facile. L'artillerie ennemie cible la grand-place, détruisant la Ford T. Tu es bloqué à Soissons.",
            "choices": [ { "text": "L'attente est mortelle. Utilise ton Check-point.", "next": 418, "link_text": "→ Retour au Chapitre 418" } ],
            "conclusive": false, "has_menu_button": true
          },

          "429": {
            "text": "Soudain, tu entends des bottes claquer sur les pavés. Une escouade de soldats allemands en reconnaissance approche de la ruelle. Tu es seul, non armé (fidèle à la neutralité de l'AFS).",
            "choices": [
              { "text": "Tu démarres la Ford T bruyamment pour t'enfuir à toute vitesse.", "next": 444, "link_text": "→ Chapitre 444" },
              { "text": "Tu te caches dans les ombres de la cave détruite et attends qu'ils passent.", "next": 132, "link_text": "→ Chapitre 132" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "444": {
            "text": "❌ IMPASSE : Le vrombissement du moteur alerte l'escouade. Ils ouvrent le feu et criblent les pneus de la Ford T.<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 444. AFS WWI Ambulance.jpg\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Ambulance AFS, 1916</span></div>Tu es bloqué dans la ruelle sous une pluie de balles.",
            "choices": [ { "text": "La discrétion t'aurait sauvé. Utilise ton Check-point.", "next": 429, "link_text": "→ Retour au Chapitre 429" } ],
            "conclusive": false, "has_menu_button": true
          },

          "132": {
            "text": "La patrouille s'éloigne. À la nuit tombée, tu démarres l'ambulance. La route vers le front de l'Aisne est un bourbier terrifiant.<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 132. Ambulance Ford T (SSU 3).jpg\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Ambulance AFS \"Ford T\" de la SSU 3</span></div>Tu t'approches de la zone de bombardement intense (le no man's land).",
            "choices": [
              { "text": "Tu allumes tes phares pour éviter de t'embourber dans les cratères.", "next": 412, "link_text": "→ Chapitre 412" },
              { "text": "Tu conduis tous phares éteints, te fiant à ton instinct de conducteur (le Système D).", "next": 385, "link_text": "→ Chapitre 385" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "412": {
            "text": "❌ IMPASSE : En allumant tes phares, tu deviens une cible parfaite. L'artillerie ennemie repère le faisceau lumineux et pilonne la route. La Ford T est détruite par le souffle d'un obus.",
            "choices": [ { "text": "La conduite de nuit est une règle de survie. Utilise ton Check-point.", "next": 132, "link_text": "→ Retour au Chapitre 132" } ],
            "conclusive": false, "has_menu_button": true
          },

          "385": {
            "text": "Tu conduis dans l'obscurité totale. Au détour d'un bois lugubre, le moteur de la Ford T tousse, crache une fumée noire et cale.<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 385. Joseph G. Weld’s AFS ambulance (Verdun 01-1917).png\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Ambulance AFS à Verdun, 1917</span></div>Tu es en panne en plein territoire exposé.",
            "choices": [
              { "text": "Tu allumes une lampe tempête pour réparer la courroie.", "next": 436, "link_text": "→ Chapitre 436" },
              { "text": "Tu répares le moteur à l'aveugle, par le simple toucher des pièces.", "next": 451, "link_text": "→ Chapitre 451" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "436": {
            "text": "❌ IMPASSE : La lueur de ta lampe tempête attire l'attention d'un sniper isolé. Une balle fracasse le radiateur de l'ambulance. Tu es cloué sur place jusqu'au matin.",
            "choices": [ { "text": "La lumière tue. Utilise ton Check-point.", "next": 385, "link_text": "→ Retour au Chapitre 385" } ],
            "conclusive": false, "has_menu_button": true
          },

          "451": {
            "text": "Grâce à ta formation mécanique à Raynouard, tu remets la courroie en place à l'aveugle. Tu reprends la route et tombes soudain sur un barrage de l'armée française. Les Poilus, épuisés et nerveux à cause des mutineries de 1917, braquent leurs fusils sur toi, te prenant pour un fuyard.",
            "choices": [
              { "text": "Tu t'énerves et hurles que tu es un envoyé officiel de Paris.", "next": 195, "link_text": "→ Chapitre 195" },
              { "text": "Tu coupes le moteur, lèves les mains et utilises un français calme et respectueux.", "next": 178, "link_text": "→ Chapitre 178" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "195": {
            "text": "❌ IMPASSE : Ton arrogance braque les Poilus. Soupçonné d'être un agitateur, tu es mis aux arrêts par la prévôté militaire. Le temps passe, l'alerte n'est pas transmise.",
            "choices": [ { "text": "L'arrogance est un mur. Utilise ton Check-point.", "next": 451, "link_text": "→ Retour au Chapitre 451" } ],
            "conclusive": false, "has_menu_button": true
          },

          "178": {
            "text": "Ta diplomatie bilingue fait merveille. Le sergent français abaisse son arme et t'escorte jusqu'au Poste de Secours de la Section 8. <br><br>Mais à l'entrée de la tente de commandement, le médecin-chef français te repousse violemment : « Pas de civils américains ici ! Retournez à l'arrière, gamin ! Les Allemands vont lancer une grande offensive ! »",
            "choices": [
              { "text": "Tu le menaces de sanctions disciplinaires au nom du QG.", "next": 236, "link_text": "→ Chapitre 236" },
              { "text": "Tu invoques la mémoire sacrée des ambulanciers de l'AFS tombés pour la France.", "next": 214, "link_text": "→ Chapitre 214" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "236": {
            "text": "❌ IMPASSE : Tu n'as aucune autorité hiérarchique sur un médecin militaire français en pleine bataille. Offensé, il te fait jeter dehors par ses ordonnances.",
            "choices": [ { "text": "La diplomatie demande du tact. Utilise ton Check-point.", "next": 178, "link_text": "→ Retour au Chapitre 178" } ],
            "conclusive": false, "has_menu_button": true
          },

          "214": {
            "text": "★ ÉNIGME HISTORIQUE ★<br><br>Tu te redresses et lui rappelles que le sang des volontaires américains a déjà coulé pour la France. Tu cites le nom du tout premier ambulancier de la SSU 3 tombé au Hartmannsweilerkopf (Alsace) en décembre 1915, et dont la mémoire force le respect absolu.<br><br>Saisis ci-dessous le nom de ce jeune martyr de l'AFS :",
            "text_input": {
              "expected": "hall",
              "next_correct": 251,
              "next_incorrect": 253,
              "button_text": "Valider ma réponse"
            },
            "choices": [],
            "conclusive": false,
            "has_menu_button": true
          },

          "253": {
            "text": "❌ IMPASSE : Erreur historique. Arthur Foster est lié à la Seconde Guerre mondiale (en Afrique du Nord). Le médecin te prend pour un imposteur qui ne connaît pas sa propre histoire.",
            "choices": [ { "text": "La mémoire de l'AFS est sacrée. Utilise ton Check-point.", "next": 214, "link_text": "→ Retour à l'énigme" } ],
            "conclusive": false, "has_menu_button": true
          },

          "251": {
            "text": "En entendant le nom de Richard Hall, le médecin se fige, ôte son képi et s'adoucit. Il te laisse entrer dans la tente. (Note: Un mémorial a récemment été érigé en Alsace en l'honneur de Richard Hall).<br><br>À l'intérieur des tentes médicales, c'est le chaos.<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 251. Tente hôpital, Chanteloup, 28 juillet 1915.jpg\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Tente hôpital, Chanteloup, juillet 1915</span></div>Tu dois trouver la taupe. Tu as deux suspects potentiels.",
            "choices": [
              { "text": "Tu décides d'interroger un blessé allemand.", "next": 482, "link_text": "→ Chapitre 482" },
              { "text": "Tu cherches le registre de garde de l'infirmerie.", "next": 264, "link_text": "→ Chapitre 264" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "482": {
            "text": "❌ IMPASSE : Le blessé allemand se met à hurler et ameute tout le poste médical. La panique profite à l'espion, qui s'enfuit dans la nature.",
            "choices": [ { "text": "Fausse piste. Utilise ton Check-point.", "next": 251, "link_text": "→ Retour au Chapitre 251" } ],
            "conclusive": false, "has_menu_button": true
          },

          "264": {
            "text": "Tu feuillettes le registre de garde. Deux noms ont eu accès aux cartes d'état-major ce soir : un vieil infirmier épuisé et un brancardier français arrivé hier de Paris.",
            "choices": [
              { "text": "Tu files le vieil infirmier.", "next": 518, "link_text": "→ Chapitre 518" },
              { "text": "Tu files le nouveau brancardier.", "next": 507, "link_text": "→ Chapitre 507" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "518": {
            "text": "❌ IMPASSE : Le vieil infirmier ne faisait que dormir dans un coin. Tu as perdu un temps précieux à surveiller un innocent.",
            "choices": [ { "text": "Mauvaise déduction. Utilise ton Check-point.", "next": 264, "link_text": "→ Retour au Chapitre 264" } ],
            "conclusive": false, "has_menu_button": true
          },

          "507": {
            "text": "Tu suis discrètement le brancardier. Il s'enferme dans la tente des transmissions radio, toutes lumières éteintes.",
            "choices": [
              { "text": "Tu fonces à l'intérieur pour l'arrêter toi-même.", "next": 533, "link_text": "→ Chapitre 533" },
              { "text": "Tu l'observes par la fente de la toile.", "next": 522, "link_text": "→ Chapitre 522" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "533": {
            "text": "❌ IMPASSE : Tu jaillis dans la tente noire. L'espion, surentraîné, te poignarde avec un scalpel et s'enfuit. Tu es gravement blessé.",
            "choices": [ { "text": "L'action solitaire est suicidaire. Utilise ton Check-point.", "next": 507, "link_text": "→ Retour au Chapitre 507" } ],
            "conclusive": false, "has_menu_button": true
          },

          "522": {
            "text": "Par la fente de la toile, tu vois le brancardier tapoter un manipulateur morse : il transmet les positions françaises à l'artillerie allemande ! Tu as démasqué la taupe !",
            "choices": [ 
              { "text": "Tu cours chercher le médecin-chef.", "next": 545, "link_text": "→ Chapitre 545" },
              { "text": "Tu tentes de couper les câbles de l'antenne extérieure.", "next": 528, "link_text": "→ Chapitre 528" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "528": {
            "text": "❌ IMPASSE : En coupant les câbles, tu fais un court-circuit bruyant. L'espion te repère, sort de la tente et t'abat dans l'obscurité. Tu meurs en héros silencieux.",
            "choices": [ { "text": "L'armée a besoin de ses cadres. Utilise ton Check-point.", "next": 522, "link_text": "→ Retour au Chapitre 522" } ],
            "conclusive": false, "has_menu_button": true
          },

          "545": {
            "text": "Tu alertes le médecin. Mais à cet instant précis, un hurlement strident déchire le ciel. L'artillerie allemande déclenche un terrible « barrage roulant ». Les obus explosent de toutes parts, soufflant les tentes.<br><br>Dans le chaos de la boue et du feu, l'espion, réalisant qu'il est découvert, s'empare des cartes d'état-major et s'enfuit vers les boyaux effondrés du no man's land.",
            "choices": [
              { "text": "Tu ramasses un fusil abandonné pour lui tirer dessus.", "next": 581, "link_text": "→ Chapitre 581" },
              { "text": "Fidèle au pacifisme de l'AFS, tu cours à sa poursuite dans la boue.", "next": 594, "link_text": "→ Chapitre 594" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "581": {
            "text": "❌ IMPASSE : Tu n'as jamais appris à utiliser une arme militaire (l'AFS est neutre).<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 581. French_soldier_uniform_WWI.jpg\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Uniforme et fusil d'un soldat français de la Première Guerre mondiale</span></div>Le fusil s'enraye. L'espion disparaît dans la nuit avec les plans.",
            "choices": [ { "text": "Tu es un secouriste, pas un soldat. Utilise ton Check-point.", "next": 545, "link_text": "→ Retour au Chapitre 545" } ],
            "conclusive": false, "has_menu_button": true
          },

          "594": {
            "text": "Tu bondis à sa poursuite. Les explosions vous encerclent. Soudain, un obus s'écrase tout près de l'espion. Il est violemment projeté au sol, la jambe déchiquetée par un éclat. Les cartes d'état-major sont éparpillées dans la boue à quelques mètres de lui.<br><br>Le feu de l'artillerie se rapproche. Tu n'as que quelques secondes.",
            "choices": [
              { "text": "Tu te précipites d'abord sur les plans pour les mettre en sécurité.", "next": 289, "link_text": "→ Chapitre 289" },
              { "text": "Tu appliques le serment de l'AFS et te jettes sur lui pour stopper l'hémorragie.", "next": 302, "link_text": "→ Chapitre 302" }
            ],
            "conclusive": false, "has_menu_button": true
          },

         "289": {
            "text": "🌟 FINALE GAGNANTE A : LE HÉROS DE LA RAISON<br><br>N'écoutant que ton sens du devoir stratégique, tu plonges dans la boue pour récupérer les pellicules et les plans in extremis. L'espion perd connaissance.<br><br>De retour à Paris, Stephen Galatti et A. Piatt Andrew te félicitent. Tu as sauvé l'offensive française d'un désastre absolu. Tu as prouvé que les volontaires de l'AFS sont des alliés d'une loyauté militaire à toute épreuve. Ton enquête longue et acharnée de Paris jusqu'au Chemin des Dames entre dans la légende.<br><br><h3 style='color: #FF7900; margin-top: 0;'>🎁 ARCHIVES DÉBLOQUÉES</h3>Félicitations, vous avez survécu à la Grande Guerre ! Visionnez ces véritables documents d'époque :<br>👉 <a href='https://drive.google.com/file/d/1JzkEMMGJmIgUKP7t-19aOFDY2ccgC7Pb/view?usp=sharing' target='_blank' style='color: #FF7900; font-weight: bold;'>AFS Our Friend France WWI (Vidéo)</a><br>👉 <a href='https://drive.google.com/file/d/1AZOerKdJPXLw3zu2BnQNXmh99Sf-TCzO/view?usp=sharing' target='_blank' style='color: #FF7900; font-weight: bold;'>The American Ambulance au Lycée Pasteur (Vidéo)</a><br>👉 <a href='https://d22dvihj4pfop3.cloudfront.net/wp-content/uploads/sites/27/2016/04/30121100/AFS_JANUS_Spring_Final_2016-MED-RES.pdf' target='_blank' style='color: #FF7900; font-weight: bold;'>The Enduring Legacy of Richard Nelville Hall (Article)</a>",
            "choices": [],
            "conclusive": true, "has_menu_button": true
          },

          "302": {
            "text": "🌟 FINALE GAGNANTE B : L'HUMANISTE DE L'AFS<br><br>Pour toi, la vie humaine passe avant tout. Tu ignores les plans et tu te jettes sur le blessé pour lui prodiguer les premiers soins vitaux. Surpris par cet acte de bonté alors qu'il est l'ennemi, l'espion s'effondre en larmes.<br><br>Touché par ta noblesse, il t'indique où sont les vrais plans et se rend. En soignant ton ennemi, tu as triomphé de la haine. Stephen Galatti est ému : tu as incarné l'essence de l'AFS, celle qui donnera naissance, après-guerre, aux grands programmes mondiaux pour la paix par l'éducation interculturelle.<br><br><h3 style='color: #FF7900; margin-top: 0;'>🎁 ARCHIVES DÉBLOQUÉES</h3>Félicitations, vous avez survécu à la Grande Guerre ! Visionnez ces véritables documents d'époque :<br>👉 <a href='https://drive.google.com/file/d/1JzkEMMGJmIgUKP7t-19aOFDY2ccgC7Pb/view?usp=sharing' target='_blank' style='color: #FF7900; font-weight: bold;'>AFS Our Friend France WWI (Vidéo)</a><br>👉 <a href='https://drive.google.com/file/d/1AZOerKdJPXLw3zu2BnQNXmh99Sf-TCzO/view?usp=sharing' target='_blank' style='color: #FF7900; font-weight: bold;'>The American Ambulance au Lycée Pasteur (Vidéo)</a><br>👉 <a href='https://d22dvihj4pfop3.cloudfront.net/wp-content/uploads/sites/27/2016/04/30121100/AFS_JANUS_Spring_Final_2016-MED-RES.pdf' target='_blank' style='color: #FF7900; font-weight: bold;'>The Enduring Legacy of Richard Nelville Hall (Article)</a>",
            "choices": [],
            "conclusive": true, "has_menu_button": true
          },



          /* ================================================================= */
          /* INTRIGUE 2 : LE TESTAMENT D'ARTHUR FOSTER (49 CHAPITRES)          */
          /* ================================================================= */

          "27": {
            "text": "Tu incarnes Jim Foster. En cet été 1942, tu débarques secrètement sur le port de Marseille, en Zone Libre.<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 27. Arthur Paisley FOSTER.jpg\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Photo d'Arthur Paisley FOSTER, qui a réellement été ambulancier AFS pendant la Première et la Seconde Guerre mondiale</span></div>Ton objectif : trouver un passage clandestin vers l'Afrique du Nord pour rejoindre la France Libre et l'unité d'ambulanciers de l'AFS où se bat ton père, Arthur. Il est porté disparu, mais tu sais qu'il transportait un carnet très précieux jetant les bases d'un projet pour l'après-guerre. Par où commencer tes recherches ?",
            "choices": [
              { "text": "Aller enquêter sur les docks auprès des débardeurs.", "next": 34, "link_text": "→ Chapitre 34" },
              { "text": "T'infiltrer discrètement dans la capitainerie du port.", "next": 52, "link_text": "→ Chapitre 52" },
              { "text": "Errer au hasard dans la ville pour trouver un contact.", "next": 49, "link_text": "→ Chapitre 49" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "49": {
            "text": "❌ IMPASSE : En errant au hasard sans plan précis, tu te retrouves coincé dans une ruelle lors d'une rafle inopinée de la police. Sans papiers en règle, tu es arrêté. L'aventure s'arrête ici.",
            "choices": [ { "text": "Ne laisse rien au hasard. Utilise ton Check-point.", "next": 27, "link_text": "→ Retour au Chapitre 27" } ],
            "conclusive": false, "has_menu_button": true
          },

          "34": {
            "text": "Tu mènes l'enquête dans les bas-fonds de Marseille, espérant trouver un débardeur ou un membre de la Résistance pour te faire passer.<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 38. Le panier, Marseille 1943. jpg\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Quartier du Panier, Marseille, 1943</span></div>Tu repères un docker qui semble organiser des passages clandestins.",
            "choices": [
              { "text": "Tenter de le corrompre avec une liasse de billets.", "next": 38, "link_text": "→ Chapitre 38" },
              { "text": "Le suivre discrètement jusqu'à un dispensaire de la Croix-Rouge.", "next": 119, "link_text": "→ Chapitre 119" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "38": {
            "text": "❌ IMPASSE : Ta tentative de corruption est grossière. Le docker, craignant un piège, te dénonce immédiatement à la police de Vichy. Tu es incarcéré.",
            "choices": [ { "text": "L'approche frontale est dangereuse. Utilise ton Check-point.", "next": 34, "link_text": "→ Retour au Chapitre 34" } ],
            "conclusive": false, "has_menu_button": true
          },

          "52": {
            "text": "Tu parviens à t'infiltrer dans les couloirs de la capitainerie du port. Les bureaux regorgent de manifestes de cargaisons. Le bureau du capitaine est juste devant toi, mais la porte est fermée.",
            "choices": [
              { "text": "Forcer la serrure de la porte du capitaine.", "next": 61, "link_text": "→ Chapitre 61" },
              { "text": "Fouiller discrètement les archives ouvertes dans le couloir.", "next": 76, "link_text": "→ Chapitre 76" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "61": {
            "text": "❌ IMPASSE : En forçant la porte, tu déclenches une alarme de sécurité stridente. Les MP (Military Police) arrivent en trombe et procèdent à ton arrestation.",
            "choices": [ { "text": "Privilégie la discrétion. Utilise ton Check-point.", "next": 52, "link_text": "→ Retour au Chapitre 52" } ],
            "conclusive": false, "has_menu_button": true
          },

          "76": {
            "text": "Dans les archives ouvertes, un registre maritime attire ton attention. Il indique qu'un navire sanitaire part demain pour l'Afrique du Nord, sous le couvert de la Croix-Rouge de Marseille !",
            "choices": [
              { "text": "Voler le registre pour effacer les traces du navire.", "next": 88, "link_text": "→ Chapitre 88" },
              { "text": "Mémoriser l'information et te rendre au QG de la Croix-Rouge.", "next": 119, "link_text": "→ Chapitre 119" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "88": {
            "text": "❌ IMPASSE : En volant le registre maritime officiel, la capitainerie bloque tous les départs par mesure de sécurité. Le navire est annulé, tu es bloqué en France.",
            "choices": [ { "text": "Ne sabote pas tes propres plans. Utilise ton Check-point.", "next": 76, "link_text": "→ Retour au Chapitre 76" } ],
            "conclusive": false, "has_menu_button": true
          },

          "119": {
            "text": "Tu arrives devant le QG de la Croix-Rouge de Marseille. L'endroit grouille de réfugiés et de personnel médical. Tu dois absolument trouver quelqu'un capable de t'embarquer sur le navire sanitaire en partance pour l'Afrique du Nord.",
            "choices": [
              { "text": "S'introduire sans permission dans le bureau du médecin-chef.", "next": 124, "link_text": "→ Chapitre 124" },
              { "text": "Faire un scandale à l'accueil pour exiger de l'aide.", "next": 93, "link_text": "→ Chapitre 93" },
              { "text": "Interroger calmement l'infirmière-chef à l'accueil.", "next": 102, "link_text": "→ Chapitre 102" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "124": {
            "text": "❌ IMPASSE : Tu fouilles le bureau du médecin-chef. Il te surprend en flagrant délit, hurle à l'espionnage et te fait jeter dehors par la sécurité. Le port t'est désormais interdit.",
            "choices": [ { "text": "La confiance se gagne, elle ne se vole pas. Utilise ton Check-point.", "next": 119, "link_text": "→ Retour au Chapitre 119" } ],
            "conclusive": false, "has_menu_button": true
          },

          "93": {
            "text": "❌ IMPASSE : Ton agressivité et ton ton hautain à l'accueil choquent le personnel. Considéré comme un perturbateur dangereux, tu es expulsé du bâtiment manu militari.",
            "choices": [ { "text": "La courtoisie est vitale. Utilise ton Check-point.", "next": 119, "link_text": "→ Retour au Chapitre 119" } ],
            "conclusive": false, "has_menu_button": true
          },

          "102": {
            "text": "Tu utilises tes compétences interculturelles pour aborder l'infirmière-chef avec respect. Face à ta sincérité, elle t'avoue qu'elle organise des exfiltrations pour la Résistance. « Je peux vous cacher dans la soute médicale du navire qui part ce soir, mais ce sera extrêmement dangereux. »",
            "choices": [
              { "text": "Accepter le risque et te cacher dans la cale.", "next": 137, "link_text": "→ Chapitre 137" },
              { "text": "Refuser par peur et chercher un autre moyen de transport.", "next": 49, "link_text": "→ Chapitre 49" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "137": {
            "text": "L'exfiltration est un succès ! Tu es caché dans la cale humide et sombre du navire médical. La traversée de la Méditerranée est tendue. Les patrouilles maritimes de l'Axe rôdent.",
            "choices": [
              { "text": "Rester sagement caché dans le noir jusqu'à l'arrivée.", "next": 156, "link_text": "→ Chapitre 156" },
              { "text": "Sortir sur le pont pour prendre l'air et te dégourdir les jambes.", "next": 148, "link_text": "→ Chapitre 148" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "148": {
            "text": "❌ IMPASSE : En sortant sur le pont, tu es repéré par une vigie. Pire, un avion de patrouille italien te photographie. Le navire est intercepté et arraisonné.",
            "choices": [ { "text": "La patience sauve des vies. Utilise ton Check-point.", "next": 137, "link_text": "→ Retour au Chapitre 137" } ],
            "conclusive": false, "has_menu_button": true
          },

          "156": {
            "text": "★ ÉNIGME HISTORIQUE ★<br><br>Tu débarques enfin en Afrique du Nord ! Mais au camp de ralliement, un sergent recruteur méfiant pointe son arme sur toi. Pour prouver ton identité en tant que membre de l'AFS, il te demande de lui donner le nom du père fondateur de l'American Field Service en 1914.<br><br><div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 156. Ambulance AFS.tif\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Ambulancier AFS en Afrique, Seconde Guerre mondiale</span></div>\nSaisis ci-dessous le nom de famille de ce fondateur :",
            "text_input": {
              "expected": "andrew",
              "next_correct": 171,
              "next_incorrect": 162,
              "button_text": "Valider ma réponse"
            },
            "choices": [],
            "conclusive": false,
            "has_menu_button": true
          },

          "162": {
            "text": "❌ IMPASSE : Mauvaise réponse. Le sergent, convaincu que tu es un espion allemand infiltré, te fait jeter au cachot. L'AFS ne te récupèrera jamais.",
            "choices": [ { "text": "L'histoire de l'AFS est primordiale. Utilise ton Check-point.", "next": 156, "link_text": "→ Retour à l'énigme" } ],
            "conclusive": false, "has_menu_button": true
          },

          "171": {
            "text": "1942, Bataille de Bir Hakeim. Tu es affecté à une ambulance Dodge. L'Afrika Korps de Rommel pilonne les positions françaises libres. <div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 171. Lettre de Gaulle à Galatti (Bir Hakeim) 1942-12.png\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Lettre de remerciements du général De Gaulle à Stephen Galatti pour l'engagement des ambulanciers AFS à la bataille de Bir Hakeim (Libye)</span></div> La poussière, la chaleur et les obus transforment l'évacuation des blessés en cauchemar.",
            "choices": [
              { "text": "Conduire prudemment en suivant la piste sécurisée par le génie.", "next": 194, "link_text": "→ Chapitre 194" },
              { "text": "Conduire hors-piste dans les dunes pour gagner de précieuses minutes.", "next": 183, "link_text": "→ Chapitre 183" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "183": {
            "text": "❌ IMPASSE : En conduisant hors-piste pour gagner du temps, ton ambulance roule sur une mine antichar enfouie dans le sable. C'est la fin du voyage.",
            "choices": [ { "text": "La sécurité passe avant la vitesse. Utilise ton Check-point.", "next": 171, "link_text": "→ Retour au Chapitre 171" } ],
            "conclusive": false, "has_menu_button": true
          },

          "194": {
            "text": "Au milieu du désert, ton ambulance croise un soldat français gravement blessé... accompagné d'un prisonnier allemand lui aussi touché.<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 194. AFS ambulance in the Western Desert 1942.jpg\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"></div>Le Français murmure : « Foster... Je connaissais un Arthur Foster. » Ton cœur bondit.",
            "choices": [
              { "text": "Soigner les deux hommes équitablement selon les principes de l'AFS.", "next": 212, "link_text": "→ Chapitre 212" },
              { "text": "Refuser de soigner le prisonnier allemand pour économiser ton matériel.", "next": 203, "link_text": "→ Chapitre 203" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "203": {
            "text": "❌ IMPASSE : En refusant de soigner un blessé ennemi, tu as violé la neutralité absolue et le serment humaniste de l'AFS. Tu es démis de tes fonctions et rapatrié par la hiérarchie.",
            "choices": [ { "text": "L'humanisme n'a pas de frontières. Utilise ton Check-point.", "next": 194, "link_text": "→ Retour au Chapitre 194" } ],
            "conclusive": false, "has_menu_button": true
          },

          "212": {
            "text": "Reconnaissant pour tes soins, le Français te remet une relique : la plaque d'identité d'Arthur.<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 212. Fiche de Coster, Charles Henry (AFS) ID 1944-04.png\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Exemple de fiche d'identité AFS. Ici : Charles Henry COSTER, avril 1944</span></div>« Ton frère n'est pas mort ici. Il a été transféré avec son unité vers l'Europe, au cœur de l'avancée alliée. »",
            "choices": [
              { "text": "Suivre l'avancée alliée vers l'Europe avec le reste de la troupe.", "next": 231, "link_text": "→ Chapitre 231" },
              { "text": "Partir seul dans le désert pour vérifier s'il n'y a pas d'autres traces.", "next": 224, "link_text": "→ Chapitre 224" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "224": {
            "text": "❌ IMPASSE : Tu pars seul. Rapidement, le Ghibli (le vent brûlant du désert) se lève. Perdu dans une tempête de sable, ton moteur serre.<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 224. Ambulances AFS.tif\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Convoi d'ambulances AFS en Afrique du Nord, Seconde Guerre mondiale</span></div>Tu n'iras pas plus loin.",
            "choices": [ { "text": "Ne te sépare jamais de ton unité. Utilise ton Check-point.", "next": 212, "link_text": "→ Retour au Chapitre 212" } ],
            "conclusive": false, "has_menu_button": true
          },

          "231": {
            "text": "Avril 1945. L'Allemagne nazie s'effondre. Tu as suivi l'armée britannique jusqu'en Europe. Ton unité d'ambulanciers AFS arrive aux portes d'un complexe effroyable : le camp de concentration de Bergen-Belsen. Les portes sont encore fermées.",
            "choices": [
              { "text": "Attendre la sécurisation militaire formelle par les troupes britanniques.", "next": 258, "link_text": "→ Chapitre 258" },
              { "text": "Tenter de forcer les barbelés seul pour entrer immédiatement.", "next": 245, "link_text": "→ Chapitre 245" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "245": {
            "text": "❌ IMPASSE : En forçant les portes avant la sécurisation, tu déclenches le tir des derniers gardes SS encore en poste. Une erreur tragique.",
            "choices": [ { "text": "La discipline sauve des vies. Utilise ton Check-point.", "next": 231, "link_text": "→ Retour au Chapitre 231" } ],
            "conclusive": false, "has_menu_button": true
          },

          "258": {
            "text": "L'entrée dans l'enfer de Bergen-Belsen est un choc absolu.<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 258. AFS Libération camp Belsen Bergen 1945.png\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Participation des ambulanciers AFS à l'évacuation du camp de concentration de Belsen Bergen, avril 1945</span></div>Des milliers de prisonniers meurent de faim et de typhus. On te confie une mission de triage médical vital.",
            "choices": [
              { "text": "Appliquer rigoureusement les protocoles de désinfection avant chaque contact.", "next": 279, "link_text": "→ Chapitre 279" },
              { "text": "Ignorer la désinfection pour soigner plus de monde plus vite.", "next": 266, "link_text": "→ Chapitre 266" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "266": {
            "text": "❌ IMPASSE : En ignorant les stricts protocoles de désinfection, tu contractes presque immédiatement le typhus. Tu deviens toi-même un patient en danger de mort, inapte à poursuivre la mission.",
            "choices": [ { "text": "La sécurité sanitaire est la première règle du soignant. Utilise ton Check-point.", "next": 258, "link_text": "→ Retour au Chapitre 258" } ],
            "conclusive": false, "has_menu_button": true
          },

          "279": {
            "text": "Face à des prisonniers terrifiés venus de toute l'Europe (Polonais, Français, Hongrois...), tu appliques les méthodes d'empathie et de communication non-verbale (sourire, gestes lents) chères à l'AFS. Un groupe semble apeuré par les uniformes alliés.",
            "choices": [
              { "text": "Les approcher doucement, en t'asseyant à leur niveau.", "next": 297, "link_text": "→ Chapitre 297" },
              { "text": "Forcer un survivant traumatisé à te parler fermement.", "next": 284, "link_text": "→ Chapitre 284" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "284": {
            "text": "❌ IMPASSE : Ton approche brutale déclenche une crise de panique chez le survivant. Le groupe s'enfuit et se cache. Tu as échoué à établir la confiance.",
            "choices": [ { "text": "La douceur est de mise. Utilise ton Check-point.", "next": 279, "link_text": "→ Retour au Chapitre 279" } ],
            "conclusive": false, "has_menu_button": true
          },

          "297": {
            "text": "★ ÉNIGME MÉDICALE ★<br><br>Tu dois organiser la distribution de vivres pour ces victimes de famine extrême. Quel est le protocole de réalimentation correct pour sauver ces prisonniers affamés depuis des mois ?",
            "choices": [
              { "text": "Leur donner de l'eau, du bouillon et des liquides en très petites quantités.", "next": 328, "link_text": "→ Chapitre 328" },
              { "text": "Leur donner du pain et de la nourriture solide pour leur redonner des forces.", "next": 315, "link_text": "→ Chapitre 315" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "315": {
            "text": "❌ IMPASSE : Erreur médicale fatale. Donner de la nourriture solide riche à des estomacs atrophiés provoque un syndrome de renutrition fatal (choc métabolique) qui tue les survivants. L'horreur s'ajoute à l'horreur.",
            "choices": [ { "text": "L'enfer est pavé de bonnes intentions. Utilise ton Check-point.", "next": 297, "link_text": "→ Retour au Chapitre 297" } ],
            "conclusive": false, "has_menu_button": true
          },

          "328": {
            "text": "Sauvé par tes soins prudents, un survivant remarque ton insigne de l'AFS. Ému, il fouille dans ses guenilles et te tend un petit carnet usé. « C'était à l'autre Américain... Arthur. Il disait que si on survivait, ce carnet sauverait le monde. »",
            "choices": [
              { "text": "L'écouter patiemment et prendre le carnet avec respect.", "next": 344, "link_text": "→ Chapitre 344" },
              { "text": "L'interrompre par impatience pour lui demander où est Arthur.", "next": 331, "link_text": "→ Chapitre 331" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "331": {
