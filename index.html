            "text": "« *Whānau* signifie la famille élargie, notre communauté, nos racines, » t'explique doucement Aroha. En entendant ton respect pour leur vocabulaire, Tama pose ses poings sur la table et te fixe avec une intensité troublante. L'air semble soudain plus lourd. « Tu parles bien français, c'est vrai, » dit Tama d'une voix grave. « Mais si tu veux vraiment comprendre l'histoire de notre *Whānau* et de ce sang versé, tu dois d'abord comprendre la blessure de notre propre terre. »",
            "choices": [
              { "text": "Accepter solennellement d'être testé sur tes connaissances du pays.", "next": 189, "link_text": "→ Chapitre 189" },
              { "text": "Soupirer bruyamment et dire que tu n'es pas à l'école.", "next": 912, "link_text": "→ Chapitre 912" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "912": {
            "text": "❌ IMPASSE : Ton soupir exaspéré ruine le moment de connexion. Tama, blessé dans sa fierté, range le carnet dans la boîte et t'interdit de l'approcher à nouveau.",
            "choices": [ { "text": "Accepte d'apprendre l'histoire des autres. Utilise ton Check-point.", "next": 56, "link_text": "→ Retour au Chapitre 56" } ],
            "conclusive": false, "has_menu_button": true
          },
          "189": {
            "text": "Le silence s'installe, seulement rompu par le crépitement du poêle à bois. Tama te regarde droit dans les yeux. « Tout notre combat pour nos droits aujourd'hui, nos terres, notre dignité, repose sur un document fondateur, que les colons ont souvent bafoué. Si tu t'es renseigné sur nous avant de venir, tu dois le savoir. »",
            "choices": [
              { "text": "Écouter très attentivement sa question.", "next": 399, "link_text": "→ Chapitre 399" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "399": {
            "text": "<b>⭐ ÉNIGME HISTORIQUE :</b><br><br>Tama te scrute : « En quelle année le célèbre Traité de Waitangi, le document fondateur de la Nouvelle-Zélande entre les chefs maoris et la Couronne britannique, a-t-il été signé ? »<br><br><i>(Saisis l'année exacte à 4 chiffres ci-dessous)</i>",
            "text_input": {
              "expected": "1840",
              "next_correct": 591,
              "next_incorrect": 804,
              "button_text": "Valider ma réponse"
            },
            "choices": [],
            "conclusive": false,
            "has_menu_button": true
          },
          "804": {
            "text": "❌ IMPASSE : Mauvaise réponse. Tama secoue la tête, les mâchoires serrées. « Tu n'es qu'un touriste ignorant de passage. » Il coupe court à la conversation.",
            "choices": [ { "text": "La connaissance historique est une preuve de respect. Utilise ton Check-point.", "next": 399, "link_text": "→ Retour à l'énigme" } ],
            "conclusive": false, "has_menu_button": true
          },
          "591": {
            "text": "« 1840... C'est exact, » souffle Tama. Une lueur de véritable respect éclaire enfin son visage. Il pousse le carnet vers toi. En traduisant la suite, un mystère palpitant se dessine : le *Pounamu* (pendentif sacré en jade vert) de Hemi a disparu dans les ruines d'Europe, mais l'ambulancier AFS a laissé un indice codé qui désigne étrangement votre montagne sacrée locale, le Mont Hikurangi ! Dès les premières lueurs de l'aube, alors que la brume enveloppe encore les collines, vous entamez une ascension éprouvante.",
            "choices": [
              { "text": "Suivre leur rythme rapide dans la boue et le froid sans te plaindre.", "next": 755, "link_text": "→ Chapitre 755" },
              { "text": "T'arrêter et te plaindre bruyamment de tes ampoules.", "next": 15, "link_text": "→ Chapitre 15" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "15": {
            "text": "❌ IMPASSE : Tes plaintes incessantes brisent la solennité spirituelle de la marche. Tama, exaspéré par ton manque de résilience, décide de faire demi-tour.",
            "choices": [ { "text": "Garde ta force mentale. Utilise ton Check-point.", "next": 591, "link_text": "→ Retour au Chapitre 591" } ],
            "conclusive": false, "has_menu_button": true
          },
          "755": {
            "text": "Tes poumons brûlent, mais tu serres les dents. Au cœur de la forêt touffue, vous arrivez devant une petite rivière dont l'eau est d'une clarté de cristal. Aroha s'arrête net. Elle t'explique d'une voix basse qu'avant de traverser, il faut s'asperger d'eau en silence pour demander la permission aux esprits de la forêt et purifier son intention.",
            "choices": [
              { "text": "Fermer les yeux, imiter ses gestes lents et respecter le rituel.", "next": 345, "link_text": "→ Chapitre 345" },
              { "text": "Traverser en courant, éclaboussant bruyamment l'eau pure.", "next": 962, "link_text": "→ Chapitre 962" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "962": {
            "text": "❌ IMPASSE : Ton attitude totalement profane et bruyante offense profondément tes hôtes et le lieu. L'expédition est annulée sur-le-champ.",
            "choices": [ { "text": "Le respect des coutumes est non-négociable. Utilise ton Check-point.", "next": 755, "link_text": "→ Retour au Chapitre 755" } ],
            "conclusive": false, "has_menu_button": true
          },
          "345": {
            "text": "L'eau glacée sur ton visage te revigore. Au sommet d'une colline dissimulée par des fougères arborescentes géantes, vous découvrez un *Pouwhenua*. C'est un grand poteau de bois sacré, sculpté de visages ancestraux aux yeux de nacre (les coquillages *pāua*). À moitié dévoré par la mousse, le bois semble vous observer.",
            "choices": [
              { "text": "T'accroupir et l'observer en silence pour comprendre ses motifs.", "next": 888, "link_text": "→ Chapitre 888" },
              { "text": "Sortir ton canif pour gratter violemment la mousse et nettoyer le bois.", "next": 124, "link_text": "→ Chapitre 124" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "124": {
            "text": "❌ IMPASSE : La lame de ton couteau raye et abîme le bois sacré. Tama pousse un hurlement de fureur. C'est une profanation impardonnable de l'œuvre d'un ancêtre.",
            "choices": [ { "text": "Ne dégrade jamais le patrimoine. Utilise ton Check-point.", "next": 345, "link_text": "→ Retour au Chapitre 345" } ],
            "conclusive": false, "has_menu_button": true
          },
          "888": {
            "text": "Aroha passe délicatement ses doigts sur les courbes de la sculpture, effleurant la mousse. C'est la clé de l'énigme ! En croisant le motif sculpté avec le texte du carnet, l'histoire se révèle : l'ambulancier AFS a sauvé Hemi lors du cauchemar de la bataille de Monte Cassino (Italie, 1944). Dans la boue et les éclats d'obus, le précieux pendentif de jade a été sauvé des pillards. L'indice pointe vers une grotte souterraine sacrée, située tout près d'ici.",
            "choices": [
              { "text": "Retourner immédiatement au village pour organiser les recherches avec les anciens.", "next": 92, "link_text": "→ Chapitre 92" },
              { "text": "Suggérer avec avidité qu'il y a peut-être un trésor ou des pièces d'or cachés avec.", "next": 578, "link_text": "→ Chapitre 578" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "578": {
            "text": "❌ IMPASSE : Tes yeux qui brillent pour l'or détruisent totalement l'aspect spirituel de cette quête. Tama te juge cupide et superficiel. L'aventure s'arrête là.",
            "choices": [ { "text": "La vraie valeur est immatérielle. Utilise ton Check-point.", "next": 888, "link_text": "→ Retour au Chapitre 888" } ],
            "conclusive": false, "has_menu_button": true
          },
          "92": {
            "text": "De retour au village en fin de journée, l'excitation est à son comble. Une découverte de cette envergure exige un *Hui* (une réunion formelle). Tout le monde se rassemble dans la grande salle commune. Assis au centre, le *Kaumātua* — l'Ancien le plus respecté de la tribu — possède un visage profondément marqué par les sillons bleutés d'un *Tā moko* traditionnel. Son aura impose un silence absolu.",
            "choices": [
              { "text": "T'asseoir en retrait, les yeux baissés, et attendre qu'on t'adresse la parole.", "next": 944, "link_text": "→ Chapitre 944" },
              { "text": "Prendre la parole en premier, debout, pour te vanter de ta trouvaille.", "next": 768, "link_text": "→ Chapitre 768" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "768": {
            "text": "❌ IMPASSE : Interrompre ou prendre la parole avant les Anciens est l'insulte suprême. Une dizaine de regards fusillent ta grossièreté. Tu es prié de quitter la salle immédiatement.",
            "choices": [ { "text": "Apprends l'étiquette et la hiérarchie locale. Utilise ton Check-point.", "next": 92, "link_text": "→ Retour au Chapitre 92" } ],
            "conclusive": false, "has_menu_button": true
          },
          "944": {
            "text": "Le rassemblement durera des heures. En attendant le jugement des Anciens, tu es invité à l'extérieur pour aider à la préparation du *Hāngī* : la cuisson d'un grand festin sous la terre. Il faut creuser une fosse profonde, y déposer des pierres chauffées à blanc par un grand brasier, puis enfouir la viande et les légumes sous des sacs humides et de la terre.",
            "choices": [
              { "text": "Saisir une pelle et participer activement, malgré la fumée brûlante et la sueur.", "next": 861, "link_text": "→ Chapitre 861" },
              { "text": "Refuser de creuser pour ne pas salir tes vêtements et regarder les autres faire.", "next": 175, "link_text": "→ Chapitre 175" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "175": {
            "text": "❌ IMPASSE : Refuser de partager l'effort physique te met au ban de la communauté. Celui qui ne travaille pas ne participe pas à la communion du repas.",
            "choices": [ { "text": "Mets la main à la pâte, c'est ça l'immersion. Utilise ton Check-point.", "next": 944, "link_text": "→ Retour au Chapitre 944" } ],
            "conclusive": false, "has_menu_button": true
          },
          "861": {
            "text": "Plus tard dans la soirée, le festin est déterré. L'odeur fumée et riche de la viande fondante emplit l'air. Tu t'assois en tailleur parmi la tribu. Lors du partage du repas, les conversations s'éteignent subitement. Le *Kaumātua* lève la tête de son assiette et plante son regard sombre, vieux comme la terre, directement dans le tien.",
            "choices": [
              { "text": "Soutenir son regard avec un respect profond, sans baisser les yeux.", "next": 596, "link_text": "→ Chapitre 596" },
              { "text": "Refuser de manger la nourriture qu'on vient de te servir car tu es calé.", "next": 381, "link_text": "→ Chapitre 381" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "381": {
            "text": "❌ IMPASSE : Refuser la nourriture sacrée (*Kaikai*), fruit d'un effort communautaire, est une gifle à leur hospitalité. Tu perds la face de manière irréparable.",
            "choices": [ { "text": "Honore toujours l'hospitalité de tes hôtes. Utilise ton Check-point.", "next": 861, "link_text": "→ Retour au Chapitre 861" } ],
            "conclusive": false, "has_menu_button": true
          },
          "596": {
            "text": "« Pourquoi un jeune *Pākehā* français, si loin des terres de ses ancêtres, cherche-t-il à déterrer les secrets de notre sang et de nos larmes ? » demande l'Ancien d'une voix gutturale qui résonne jusqu'aux chevrons de la salle.",
            "choices": [
              { "text": "Répondre avec le cœur, parlant de l'idéal de fraternité d'AFS.", "next": 774, "link_text": "→ Chapitre 774" },
              { "text": "Répondre avec arrogance que sans ton aide et ton génie, ils n'auraient rien trouvé.", "next": 108, "link_text": "→ Chapitre 108" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "108": {
            "text": "❌ IMPASSE : Ton complexe insupportable du sauveur exaspère l'assemblée entière. Un murmure de colère monte. On te demande de te taire et de sortir.",
            "choices": [ { "text": "L'humilité est la clé des grandes découvertes. Utilise ton Check-point.", "next": 596, "link_text": "→ Retour au Chapitre 596" } ],
            "conclusive": false, "has_menu_button": true
          },
          "774": {
            "text": "La gorge serrée, tu parles de l'American Field Service, bâti par des ambulanciers persuadés que les liens humains surpassent l'horreur de la guerre. Tu expliques que chercher ce pendentif, c'est honorer la mémoire de ces hommes qui ont refusé la haine. Le visage tatoué de l'Ancien se détend. Il sourit doucement. Levant sa canne en bois sculpté, il vous révèle enfin l'emplacement exact de la crevasse cachée.",
            "choices": [
              { "text": "Remercier et attendre le lever du soleil pour y aller avec Tama et Aroha.", "next": 33, "link_text": "→ Chapitre 33" },
              { "text": "Vouloir jouer au héros et y aller seul immédiatement, en pleine nuit.", "next": 928, "link_text": "→ Chapitre 928" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "928": {
            "text": "❌ IMPASSE : S'aventurer seul, de nuit, dans un domaine forestier sacré et potentiellement accidenté est dangereux et profondément irrespectueux.",
            "choices": [ { "text": "La patience et le groupe sont tes meilleures armes. Utilise ton Check-point.", "next": 774, "link_text": "→ Retour au Chapitre 774" } ],
            "conclusive": false, "has_menu_button": true
          },
          "33": {
            "text": "Au petit matin, le gel recouvre l'herbe. Guidés par les indications de l'Ancien, vous arrivez devant une faille rocheuse étroite, dissimulée par des racines tombantes. L'air qui s'en échappe est glacial, puant la pierre humide. L'entrée de la grotte plonge dans des ténèbres absolues.",
            "choices": [
              { "text": "T'arrêter en silence et attendre qu'Aroha prononce le *Karakia*.", "next": 584, "link_text": "→ Chapitre 584" },
              { "text": "Allumer ta lampe torche et entrer en premier, en courant et en criant.", "next": 819, "link_text": "→ Chapitre 819" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "819": {
            "text": "❌ IMPASSE : Entrer comme un boulet de canon sans prière de protection brise la connexion spirituelle avec les ancêtres. Aroha, outrée, fait demi-tour.",
            "choices": [ { "text": "Respecte la spiritualité et le rythme du lieu. Utilise ton Check-point.", "next": 33, "link_text": "→ Retour au Chapitre 33" } ],
            "conclusive": false, "has_menu_button": true
          },
          "584": {
            "text": "Aroha ferme les yeux. Son chant mélancolique, le *Karakia*, s'élève et résonne contre la roche brute, invoquant la protection et la paix. Vous pénétrez dans l'obscurité. Le faisceau de vos lampes balaye les stalactites. Tout au fond, posée sur une corniche de pierre, intacte sous une épaisse couche de poussière grise, repose une vieille sacoche militaire en toile. Elle arbore l'aigle brodé, l'emblème de l'AFS de la Seconde Guerre mondiale.",
            "choices": [
              { "text": "Approcher et ouvrir la sacoche avec une extrême précaution.", "next": 194, "link_text": "→ Chapitre 194" },
              { "text": "Déchirer brutalement la toile pourrie pour voir ce qu'il y a dedans.", "next": 981, "link_text": "→ Chapitre 981" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "981": {
            "text": "❌ IMPASSE : En déchirant la toile avec hâte, le tissu pourri cède d'un coup. Le contenu tombe dans une crevasse sombre et inaccessible sous vos pieds. Tout est perdu.",
            "choices": [ { "text": "Prends soin des artefacts comme de ta vie. Utilise ton Check-point.", "next": 584, "link_text": "→ Retour au Chapitre 584" } ],
            "conclusive": false, "has_menu_button": true
          },
          "194": {
            "text": "Tu détaches les sangles raidies par le temps. À l'intérieur, protégé de l'humidité : le *Pounamu* (le pendentif sacré) de Hemi, dont le jade poli luit doucement à la lumière. À côté, une médaille militaire française ternie, et une lettre en papier pelure rédigée par l'ambulancier AFS. L'émotion te noue la gorge.",
            "choices": [
              { "text": "Traduire immédiatement la lettre à voix haute pour Tama et Aroha.", "next": 836, "link_text": "→ Chapitre 836" },
              { "text": "Glisser discrètement la médaille dans ta poche pour l'avoir en souvenir.", "next": 792, "link_text": "→ Chapitre 792" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "792": {
            "text": "❌ IMPASSE : Voler un héritage familial, même par simple attrait pour les antiquités, est un vol ignoble. Tama te surprend. Tu es renvoyé en France dans le déshonneur absolu.",
            "choices": [ { "text": "L'intégrité est la vertu cardinale d'AFS. Utilise ton Check-point.", "next": 194, "link_text": "→ Retour au Chapitre 194" } ],
            "conclusive": false, "has_menu_button": true
          },
          "836": {
            "text": "Sous la lumière tremblotante des lampes, tu traduis l'écriture élégante de l'ambulancier. Il explique qu'il n'a pas volé le Pounamu, mais qu'il l'a arraché aux décombres fumants de Monte Cassino pour éviter qu'il ne soit pillé par l'ennemi. Promettant à Hemi, grièvement blessé, de protéger son âme, l'ambulancier français l'a confié à un autre Maori pour qu'il le ramène au pays après la guerre. Le visage dur de Tama se brise. Des larmes silencieuses tracent des sillons sur ses joues. Il pose une main lourde et chaude sur ton épaule.",
            "choices": [
              { "text": "Ressortir de la grotte et ramener triomphalement la sacoche au *Marae*.", "next": 993, "link_text": "→ Chapitre 993" },
              { "text": "Suggérer de revendre le bijou de jade à un musée néo-zélandais.", "next": 312, "link_text": "→ Chapitre 312" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "312": {
            "text": "❌ IMPASSE : La cupidité brise le sortilège. Parler d'argent face à une relique d'âme pulvérise instantanément le lien émotionnel d'une pureté rare que tu venais de tisser.",
            "choices": [ { "text": "Comprends la valeur de l'immatériel. Utilise ton Check-point.", "next": 836, "link_text": "→ Retour au Chapitre 836" } ],
            "conclusive": false, "has_menu_button": true
          },
          "993": {
            "text": "La marche du retour vers le village s'effectue dans une joie vibrante. Le soleil couchant baigne le *Marae* d'une lumière dorée. La communauté entière, prévenue de votre retour, est rassemblée. Tama se tient bien droit au centre de la cour, le Pounamu de son arrière-grand-père brillant sur sa poitrine. Il se tourne vers toi et te fait signe de t'avancer. Devant les Anciens silencieux, il te demande de tirer la conclusion de cette incroyable odyssée.",
            "choices": [
              { "text": "Avancer d'un pas, gonfler les poumons, et prononcer le discours final.", "next": 705, "link_text": "→ Chapitre 705" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "705": {
            "text": "<b>⭐ ÉNIGME FINALE (DIALOGUES) :</b><br><br>Des dizaines de regards profonds et attentifs sont braqués sur toi. La brise du soir fait frissonner les feuilles des arbres. C'est l'heure de prouver que ton année d'échange t'a radicalement transformé. Quel est, selon toi, le véritable message laissé par cette alliance de sang entre un ambulancier français et un soldat maori sous la mitraille ?",
            "choices": [
              { "text": "Affirmer avec fierté que c'est la preuve que les Européens sont de formidables protecteurs.", "next": 873, "link_text": "→ Faire cette déclaration" },
              { "text": "Affirmer que leur amitié symbolise la fraternité humaine inébranlable au-delà des frontières.", "next": 231, "link_text": "→ Faire cette déclaration" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "873": {
            "text": "❌ IMPASSE : Ton terrible complexe de supériorité colonial jette un froid mortel sur la cérémonie. Le visage de Tama se fige. Tu as totalement manqué la leçon d'humilité de ce voyage.",
            "choices": [ { "text": "L'égalité et la fraternité sont les vraies réponses. Utilise ton Check-point.", "next": 705, "link_text": "→ Retour à l'énigme" } ],
            "conclusive": false, "has_menu_button": true
          },
          "231": {
            "text": "Tes mots, choisis avec soin, résonnent de justesse, d'humilité et d'amour. Le *Kaumātua* hoche la tête, l'œil brillant. Tama s'approche de toi. Il pose ses mains sur tes épaules. Lentement, il penche son visage vers le tien et réalise un *Hongi* traditionnel : vos fronts et vos nez se touchent tendrement. Vous partagez le même souffle de vie (*Ha*). À cet instant précis, tu n'es plus un simple lycéen français perdu au bout du monde. Tu fais définitivement partie de leur *Whānau*.",
            "choices": [
              { "text": "Découvrir la conclusion A : Le Gardien de la Mémoire", "next": 903, "link_text": "→ Finale A" },
              { "text": "Découvrir la conclusion B : Le Frère d'Armes", "next": 844, "link_text": "→ Finale B" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "903": {
            "text": "🌟 FINALE GAGNANTE A (Le Gardien de la Mémoire) <br><br>Ton discours brillant, dénué de tout ego, et ton profond respect ont conquis l'âme de la communauté. Les mois qui suivent sont idylliques. Aroha et toi travaillez jour et nuit pour monter une magnifique exposition locale relatant l'histoire croisée des volontaires de l'AFS et du 28e Bataillon maori. Lorsque tu retournes en France à la fin de ton année, tu n'es pas seulement bilingue : tu es porteur d'une sagesse ancestrale. Par ta persévérance et ton empathie, tu es devenu un véritable pont de lumière entre deux cultures que la géographie semblait opposer.",
            "choices": [],
            "conclusive": true, "has_menu_button": true
          },
          "844": {
            "text": "🌟 FINALE GAGNANTE B (Le Frère d'Armes) <br><br>L'hostilité farouche de Tama du premier jour s'est métamorphosée en une amitié indéfectible, forte comme le roc. Au fil des saisons, il t'emmène pêcher, t'enseigne les chants, la sculpture sur bois et la philosophie profonde de son peuple lié à la Terre. En retrouvant la médaille de Hemi et le précieux Pounamu, tu n'as pas seulement résolu une énigme, tu as guéri une blessure du passé. Tu laisses une marque indélébile sur les collines de Gisborne : l'image d'une jeunesse étrangère brillante, loyale et profondément humaine, fière héritière des fondateurs visionnaires d'AFS.",
            "choices": [],
            "conclusive": true, "has_menu_button": true
          },


          
 /* ================================================================= */

          "63": {
            "text": "<b>SEPTEMBRE 2015</b><br><br>Tu incarnes Salma, 17 ans, originaire de Tunis. Ta bourse AFS t'a propulsée dans les Yvelines, chez les <i>de Chavigny</i>, une famille très bourgeoise, stricte et attachée aux traditions. Le choc est immense. Lors de ton premier dîner, servi avec l'argenterie familiale, les remarques condescendantes sur ton pays s'enchaînent sous couvert de politesse mondaine.",
            "choices": [
              { "text": "Prendre sur toi et tenter de t'adapter à leurs codes.", "next": 258, "link_text": "→ Chapitre 258" },
              { "text": "Critiquer ouvertement leur nourriture et leur snobisme.", "next": 104, "link_text": "→ Chapitre 104" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "104": {
            "text": "❌ IMPASSE : Ton impolitesse choque profondément les de Chavigny. L'année commence sur une guerre froide insupportable.",
            "choices": [ { "text": "La diplomatie est la première étape. Utilise ton Check-point.", "next": 63, "link_text": "→ Retour au Chapitre 63" } ],
            "conclusive": false, "has_menu_button": true
          },
          "258": {
            "text": "Tu fais ta rentrée dans un lycée privé élitiste. Dans les couloirs, tu te sens dévisagée. Arthur, le fils d'un élu local au sourire arrogant, se moque ouvertement de ton accent devant son groupe d'amis.",
            "choices": [
              { "text": "Garder ton calme et lui répondre avec une ironie mordante.", "next": 466, "link_text": "→ Chapitre 466" },
              { "text": "Le gifler devant tout le monde pour exiger le respect.", "next": 371, "link_text": "→ Chapitre 371" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "371": {
            "text": "❌ IMPASSE : La violence physique te vaut un blâme immédiat de la direction. Tu es stigmatisée comme une élève \"à problèmes\".",
            "choices": [ { "text": "Les mots sont plus forts que les poings. Utilise ton Check-point.", "next": 258, "link_text": "→ Retour au Chapitre 258" } ],
            "conclusive": false, "has_menu_button": true
          },
          "466": {
            "text": "Tu le moucheras avec tant d'esprit qu'il en reste muet. Pour améliorer ton intégration, tu t'inscris au club de théâtre du lycée. Mais le professeur ne te propose que des rôles stéréotypés de servante muette.",
            "choices": [
              { "text": "Aller lui parler en privé pour refuser d'être enfermée dans un cliché.", "next": 619, "link_text": "→ Chapitre 619" },
              { "text": "Sécher les cours de théâtre pour fuir le lycée.", "next": 509, "link_text": "→ Chapitre 509" },
              { "text": "Accepter le rôle en baissant la tête.", "next": 727, "link_text": "→ Chapitre 727" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "509": {
            "text": "❌ IMPASSE : En fuyant, tu t'isoles totalement. L'échange AFS devient un cauchemar de solitude.",
            "choices": [ { "text": "Fais face aux difficultés. Utilise ton Check-point.", "next": 466, "link_text": "→ Retour au Chapitre 466" } ],
            "conclusive": false, "has_menu_button": true
          },
          "727": {
            "text": "❌ IMPASSE : En acceptant le cliché, tu perds l'estime de toi-même et tu confortes leurs préjugés.",
            "choices": [ { "text": "Défends ton identité. Utilise ton Check-point.", "next": 466, "link_text": "→ Retour au Chapitre 466" } ],
            "conclusive": false, "has_menu_button": true
          },
          "619": {
            "text": "Le professeur, surpris par ton audace et ton excellente maîtrise du français, s'excuse et t'offre un vrai rôle. Un mois plus tard, la famille de Chavigny t'emmène au Country Club local. L'entre-soi y est étouffant.",
            "choices": [
              { "text": "Essayer d'éduquer poliment les invités qui font des remarques sur l'Afrique.", "next": 854, "link_text": "→ Chapitre 854" },
              { "text": "Faire un scandale et quitter le club en courant.", "next": 517, "link_text": "→ Chapitre 517" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "517": {
            "text": "❌ IMPASSE : Ton esclandre humilie ta famille d'accueil en public. La relation de confiance est rompue.",
            "choices": [ { "text": "Garde ton sang-froid. Utilise ton Check-point.", "next": 619, "link_text": "→ Retour au Chapitre 619" } ],
            "conclusive": false, "has_menu_button": true
          },
          "854": {
            "text": "En sortant, la mère d'accueil, gênée par les regards, veut t'emmener dans une boutique pour t'acheter des vêtements \"plus discrets, plus français\".",
            "choices": [
              { "text": "Refuser poliment en expliquant que ton identité n'est pas un déguisement.", "next": 688, "link_text": "→ Chapitre 688" },
              { "text": "Hurler dans la boutique qu'elle est raciste.", "next": 988, "link_text": "→ Chapitre 988" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "988": {
            "text": "❌ IMPASSE : Ton agressivité braque définitivement la mère d'accueil qui pensait, bien que maladroitement, t'aider.",
            "choices": [ { "text": "L'explication vaut mieux que l'insulte. Utilise ton Check-point.", "next": 854, "link_text": "→ Retour au Chapitre 854" } ],
            "conclusive": false, "has_menu_button": true
          },
          "688": {
            "text": "<b>VENDREDI 13 NOVEMBRE 2015.</b><br><br>Le monde bascule. Devant la télévision du salon, la famille est pétrifiée en découvrant les attentats de Paris. L'effroi saisit tout le pays. Le regard de tes parents d'accueil change subtilement.",
            "choices": [
              { "text": "Rester au salon avec eux pour partager la douleur nationale.", "next": 859, "link_text": "→ Chapitre 859" },
              { "text": "T'enfermer dans ta chambre, indifférente à leur chagrin.", "next": 734, "link_text": "→ Chapitre 734" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "734": {
            "text": "❌ IMPASSE : Ton manque d'empathie face au drame du pays qui t'accueille est vu comme un acte de défiance impardonnable.",
            "choices": [ { "text": "La douleur n'a pas de frontières. Utilise ton Check-point.", "next": 688, "link_text": "→ Retour au Chapitre 688" } ],
            "conclusive": false, "has_menu_button": true
          },
          "859": {
            "text": "Les jours qui suivent sont toxiques. Au lycée, les élèves issus de l'immigration rasent les murs. Un soir, au dîner, le père d'accueil, terrorisé par les infos, fait des amalgames violents sur l'islam, les réfugiés et l'insécurité. Tu as la nausée.",
            "choices": [
              { "text": "Appeler Hélène, ta référente AFS, pour demander une médiation d'urgence.", "next": 13, "link_text": "→ Chapitre 13" },
              { "text": "Insulter le père, faire tes valises et vouloir rentrer à Tunis.", "next": 907, "link_text": "→ Chapitre 907" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "907": {
            "text": "❌ IMPASSE : La fugue ne résout rien. Tu rentres en Tunisie avec un sentiment d'échec cuisant et d'injustice.",
            "choices": [ { "text": "Le dialogue est la mission d'AFS. Utilise ton Check-point.", "next": 859, "link_text": "→ Retour au Chapitre 859" } ],
            "conclusive": false, "has_menu_button": true
          },
          "13": {
            "text": "Hélène arrive le lendemain soir. En tant que bénévole AFS formée à la gestion de crise, elle réunit tout le monde dans le salon et impose le respect de la parole. Elle se tourne vers toi : « Salma, dis-leur ce que tu ressens. »",
            "choices": [
              { "text": "Exprimer ta douleur avec vulnérabilité et clarté.", "next": 237, "link_text": "→ Chapitre 237" },
              { "text": "Profiter du moment pour humilier la famille.", "next": 128, "link_text": "→ Chapitre 128" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "128": {
            "text": "❌ IMPASSE : La médiation se transforme en tribunal. La famille se braque, AFS doit te changer de foyer.",
            "choices": [ { "text": "La médiation cherche la compréhension, pas la vengeance. Utilise ton Check-point.", "next": 13, "link_text": "→ Retour au Chapitre 13" } ],
            "conclusive": false, "has_menu_button": true
          },
          "237": {
            "text": "La voix tremblante, tu expliques que leurs mots sont des lames, que tu hais les terroristes autant qu'eux, et que tu te sens rejetée. Le père, très mal à l'aise, admet que la peur l'a fait déraper. Il s'excuse à demi-mot. L'intervention d'Hélène a apaisé les choses, l'air est à nouveau respirable dans la maison, mais tu n'es pas naïve : cette trêve ne règlera pas instantanément les préjugés enfouis.",
            "choices": [
              { "text": "Accepter cette trêve imparfaite mais précieuse.", "next": 452, "link_text": "→ Chapitre 452" },
              { "text": "Exiger qu'ils fassent des excuses publiques sur les réseaux sociaux.", "next": 349, "link_text": "→ Chapitre 349" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "349": {
            "text": "❌ IMPASSE : Ton exigence disproportionnée ruine les efforts d'Hélène. La famille se referme comme une huître.",
            "choices": [ { "text": "Accepte les petites victoires. Utilise ton Check-point.", "next": 237, "link_text": "→ Retour au Chapitre 237" } ],
            "conclusive": false, "has_menu_button": true
          },
          "452": {
            "text": "À la fin de la soirée, Hélène te prend à part. « Salma, ta colère est légitime. Mais ne la laisse pas te détruire. Utilise-la. Inscris-toi au grand Concours d'Éloquence du département. Fais entendre ta voix. »",
            "choices": [
              { "text": "Accepter ce défi immense.", "next": 691, "link_text": "→ Chapitre 691" },
              { "text": "Refuser, persuadée que les mots ne changeront rien au racisme.", "next": 574, "link_text": "→ Chapitre 574" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "574": {
            "text": "❌ IMPASSE : En renonçant à la parole, tu laisses la place aux discours de haine. Tu termines ton année dans le silence.",
            "choices": [ { "text": "Prends ta place. Utilise ton Check-point.", "next": 452, "link_text": "→ Retour au Chapitre 452" } ],
            "conclusive": false, "has_menu_button": true
          },
          "691": {
            "text": "<b>⭐ ÉNIGME HISTORIQUE :</b><br><br>Pour préparer ton premier discours, tu cherches l'inspiration dans le Siècle des Lumières. Quel philosophe français, à la suite de l'injuste affaire Calas, a écrit le célèbre *Traité sur la tolérance* en 1763 ?<br><br><i>(Saisis le nom de l'auteur ci-dessous)</i>",
            "text_input": {
              "expected": "voltaire",
              "next_correct": 843,
              "next_incorrect": 715,
              "button_text": "Valider ma réponse"
            },
            "choices": [],
            "conclusive": false,
            "has_menu_button": true
          },
          "715": {
            "text": "❌ IMPASSE : Mauvaise réponse. Sans base historique solide, ta page reste blanche et tu ne trouves pas l'inspiration.",
            "choices": [ { "text": "Cherche du côté des Lumières. Utilise ton Check-point.", "next": 691, "link_text": "→ Retour à l'énigme" } ],
            "conclusive": false, "has_menu_button": true
          },
          "843": {
            "text": "Voltaire ! Portée par son texte, tu écris un brouillon flamboyant. Mais le lendemain au lycée, tu trouves la porte de ton casier fracturée. Tes notes ont disparu. Tu aperçois Arthur et ses amis ricaner au bout du couloir.",
            "choices": [
              { "text": "Appeler Hélène pour trouver une solution constructive.", "next": 53, "link_text": "→ Chapitre 53" },

            ],
            "conclusive": false, "has_menu_button": true
          },
          "975": {
            "text": "❌ IMPASSE : La méchanceté a gagné. Tu abandonnes et Arthur triomphe sans gloire.",
            "choices": [ { "text": "Ne les laisse pas gagner. Utilise ton Check-point.", "next": 843, "link_text": "→ Retour au Chapitre 843" } ],
            "conclusive": false, "has_menu_button": true
          },
          "53": {
            "text": "Hélène sent ton abattement. Pour te redonner foi en la France, elle t'emmène assister à une maraude avec les bénévoles de la Croix-Rouge. Tu y vois des jeunes de toutes origines unis par la solidarité.",
            "choices": [
              { "text": "Aller discuter avec les bénévoles pour t'en inspirer.", "next": 355, "link_text": "→ Chapitre 355" },
              { "text": "Rester dans le camion, refusant de sortir.", "next": 172, "link_text": "→ Chapitre 172" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "172": {
            "text": "❌ IMPASSE : En t'enfermant sur toi-même, tu rates la plus belle leçon d'humanité de ton séjour.",
            "choices": [ { "text": "Ouvre les yeux sur le positif. Utilise ton Check-point.", "next": 53, "link_text": "→ Retour au Chapitre 53" } ],
            "conclusive": false, "has_menu_button": true
          },
          "355": {
            "text": "L'énergie de ces bénévoles rallume la flamme en toi. Tu décides de réécrire ton discours de mémoire, encore plus puissant qu'avant. Tu rentres travailler d'arrache-pied.",
            "choices": [
              { "text": "Continuer à travailler jusque tard dans la nuit.", "next": 41, "link_text": "→ Chapitre 41" },
              { "text": "Rester muette et fermée quand la famille d'accueil approche.", "next": 281, "link_text": "→ Chapitre 281" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "281": {
            "text": "❌ IMPASSE : Ton attitude fermée décourage toute tentative de reconnexion avec ta famille.",
            "choices": [ { "text": "Reste ouverte. Utilise ton Check-point.", "next": 355, "link_text": "→ Retour au Chapitre 355" } ],
            "conclusive": false, "has_menu_button": true
          },
          "41": {
            "text": "En te voyant répéter seule dans le salon à minuit, ta mère d'accueil, Madame de Chavigny, s'approche avec un thé chaud. Hésitante, elle te propose de corriger tes erreurs de diction et de t'apprendre à poser ta voix.",
            "choices": [
              { "text": "Accepter son aide. C'est un pas vers la réconciliation.", "next": 277, "link_text": "→ Chapitre 277" },
              { "text": "Refuser sèchement par rancune pour le passé.", "next": 163, "link_text": "→ Chapitre 163" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "163": {
            "text": "❌ IMPASSE : Ta rancune détruit la main tendue. La mère d'accueil se retire, blessée.",
            "choices": [ { "text": "Pardonner est le début de la paix. Utilise ton Check-point.", "next": 41, "link_text": "→ Retour au Chapitre 41" } ],
            "conclusive": false, "has_menu_button": true
          },
          "277": {
            "text": "Premier tour du concours devant l'académie. Le sujet : *L'identité est-elle une prison ?*",
            "choices": [
              { "text": "Défendre l'idée que l'identité est un pont, pas un mur.", "next": 498, "link_text": "→ Chapitre 498" },
              { "text": "Réciter un discours académique ennuyeux et sans âme.", "next": 386, "link_text": "→ Chapitre 386" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "386": {
            "text": "❌ IMPASSE : Sans passion, le jury t'élimine dès le premier tour.",
            "choices": [ { "text": "Mets ton cœur dans tes mots. Utilise ton Check-point.", "next": 277, "link_text": "→ Retour au Chapitre 277" } ],
            "conclusive": false, "has_menu_button": true
          },
          "498": {
            "text": "Ton discours électrise la salle. Tu passes en quart, puis en demi-finale ! En coulisses, Arthur, sentant le danger, s'approche de toi : « Retourne chez toi, tu n'as pas le niveau pour la grande France. »",
            "choices": [
              { "text": "L'ignorer avec un mépris royal et te concentrer.", "next": 638, "link_text": "→ Chapitre 638" },
              { "text": "Lui jeter ta bouteille d'eau au visage.", "next": 522, "link_text": "→ Chapitre 522" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "522": {
            "text": "❌ IMPASSE : Disqualification immédiate pour comportement violent. Arthur a gagné.",
            "choices": [ { "text": "Ne cède pas à la provocation. Utilise ton Check-point.", "next": 498, "link_text": "→ Retour au Chapitre 498" } ],
            "conclusive": false, "has_menu_button": true
          },
          "638": {
            "text": "Tu l'ignores. Tu remportes la demi-finale. Dans le public, Monsieur de Chavigny applaudit à tout rompre, fier de \"sa\" lycéenne. Demain a lieu la Grande Finale à la préfecture. Tu affronteras Arthur. Le sujet tombe : *Faut-il avoir peur de l'autre ?*",
            "choices": [
              { "text": "Passer la nuit à ciseler tes arguments avec Hélène.", "next": 77, "link_text": "→ Chapitre 77" },
              { "text": "Sortir faire la fête, sûre de ta victoire.", "next": 764, "link_text": "→ Chapitre 764" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "764": {
            "text": "❌ IMPASSE : L'arrogance te perd. Tu arrives fatiguée et tu bafouilles à la finale.",
            "choices": [ { "text": "Le travail paie jusqu'au bout. Utilise ton Check-point.", "next": 638, "link_text": "→ Retour au Chapitre 638" } ],
            "conclusive": false, "has_menu_button": true
          },
          "77": {
            "text": "Hélène te prévient : « Arthur va jouer sur les peurs liées aux attentats pour gagner le public. Ne tombe pas dans l'émotion pure, reste cartésienne. »",
            "choices": [
              { "text": "Préparer une argumentation implacable basée sur la logique.", "next": 294, "link_text": "→ Chapitre 294" },
              { "text": "Prévoir simplement d'insulter la bourgeoisie d'Arthur.", "next": 185, "link_text": "→ Chapitre 185" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "185": {
            "text": "❌ IMPASSE : L'insulte n'est pas de l'éloquence. Le jury te pénalise sévèrement.",
            "choices": [ { "text": "Élève le débat. Utilise ton Check-point.", "next": 77, "link_text": "→ Retour au Chapitre 77" } ],
            "conclusive": false, "has_menu_button": true
          },
          "294": {
            "text": "La Finale. L'auditorium est plein à craquer. Arthur parle en premier. D'une voix faussement rassurante, il distille un discours xénophobe, assimilant l'immigration au danger et à la perte d'identité. La foule applaudit, l'ambiance est lourde. C'est à toi.",
            "choices": [
              { "text": "Avancer vers le pupitre, le regard haut.", "next": 448, "link_text": "→ Chapitre 448" },
              { "text": "Paniquer face à la foule et t'enfuir en coulisses.", "next": 311, "link_text": "→ Chapitre 311" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "311": {
            "text": "❌ IMPASSE : La peur de la scène te paralyse. Le silence de la salle signe ta défaite.",
            "choices": [ { "text": "Respire un grand coup. Utilise ton Check-point.", "next": 294, "link_text": "→ Retour au Chapitre 294" } ],
            "conclusive": false, "has_menu_button": true
          },
          "448": {
            "text": "<b>⭐ ÉNIGME FINALE (DIALOGUES) :</b><br><br>Arthur te regarde avec un sourire en coin. Le silence est absolu dans la salle. Comment commences-tu ton discours pour démonter son argumentaire fondé sur la peur du terrorisme ?",
            "choices": [
              { "text": "« Vous êtes tous des racistes aveuglés par vos privilèges ! »", "next": 555, "link_text": "→ Faire cette déclaration" },
              { "text": "« Je n'ai rien à voir avec ces gens-là, je suis d'un milieu éduqué ! »", "next": 679, "link_text": "→ Faire cette déclaration" },
              { "text": "« Le danger n'a pas de nationalité, mais la fraternité est notre seul bouclier. »", "next": 783, "link_text": "→ Faire cette déclaration" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "555": {

          "783": {

            "choices": [
              { "text": "Découvrir la conclusion A : La Plume de la Paix", "next": 891, "link_text": "→ Finale A" },
              { "text": "Découvrir la conclusion B : Le Réveil d'une Famille", "next": 922, "link_text": "→ Finale B" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "891": {
            "text": "🌟 FINALE GAGNANTE A (La Plume de la Paix) <br><br>Le jury te déclare grande gagnante à l'unanimité. Ton discours devient viral dans le département. Hélène te serre dans ses bras : tu as incarné la mission même d'AFS. Plus tard, tu publieras ce texte dans le journal du lycée, devenant un symbole de tolérance et prouvant que face aux balles et à la haine, la culture et l'éloquence restent nos armes les plus absolues.",

            "conclusive": true, "has_menu_button": true

          "922": {
            "text": "🌟 FINALE GAGNANTE B (Le Réveil d'une Famille) <br><br>Au premier rang, tes parents d'accueil sont en larmes. En rentrant chez les de Chavigny le soir de ta victoire, l'argenterie n'a plus d'importance. Monsieur de Chavigny te prend dans ses bras et te remercie de leur avoir ouvert les yeux. Ton année se termine dans une chaleur familiale inespérée. Tu n'as pas seulement gagné un concours, tu as changé le cœur des gens qui t'ont accueillie.",

          "inscription": {
            "text": "Bienvenue dans cette aventure historique de l'AFS !<br><br>Avant de commencer, veuillez vous identifier pour enregistrer votre progression.",
            "is_registration": true,
            "choices": [],
            "conclusive": false,
            "has_menu_button": false
          },

          "game_over": {
            "text": "💀 GAME OVER 💀<br><br>Vous avez fait trop d'erreurs fatales et épuisé toutes vos ressources. La mission est un échec.<br><br><i>Vos données ont été transmises au quartier général.</i>",
            "choices": [ { "text": "Recommencer une nouvelle partie", "next": "menu", "link_text": "" } ],

            "has_menu_button": false

        }; // <-- LA VOICI ENFIN, NE LA SUPPRIME PAS !


        // Moteur du jeu qui lit le JSON et affiche la page

    // ==========================================
        // VARIABLES GLOBALES DU JOUEUR ET DU SCORE
        // ==========================================
        let playerScore = 100;
        let playerName = "";
        let playerEmail = "";
        let playerBirthYear = "";
        let currentIntrigue = "Non sélectionnée";

        // Création de l'affichage du score (Jauge de vie)
        let scoreDiv = document.createElement('div');
        scoreDiv.id = 'score-display';
        scoreDiv.style.position = 'fixed';
        scoreDiv.style.top = '15px';
        scoreDiv.style.right = '15px';
        scoreDiv.style.backgroundColor = '#C4262E';
        scoreDiv.style.color = 'white';
        scoreDiv.style.padding = '10px 15px';
        scoreDiv.style.borderRadius = '8px';
        scoreDiv.style.fontWeight = 'bold';
        scoreDiv.style.boxShadow = '0 4px 6px rgba(0,0,0,0.1)';
        scoreDiv.style.display = 'none'; // Caché sur l'écran d'accueil
        scoreDiv.style.zIndex = '1000';
        document.body.appendChild(scoreDiv);


        // ==========================================
        // FONCTION D'ENVOI AU TABLEAU DE BORD (WEBHOOK)
        // ==========================================

           function sendDataToGoogle(resultat) {
            // 🔴 REMPLACE CE LIEN PAR CELUI QUE TU AS COPIÉ DANS GOOGLE SCRIPT 🔴
            const webhookUrl = "https://docs.google.com/spreadsheets/d/1tzy0UbQImVURu7xpVxkC3h_2MNcaQnZof1aClSNpx6o/edit?gid=0#gid=0"; 
     
            const dateJeu = new Date().toLocaleString('fr-FR');
            const data = {
                date: dateJeu,
                nom: playerName,
                email: playerEmail,
                annee: playerBirthYear,
                intrigue: currentIntrigue,
                score: playerScore,
                statut: resultat
            };

            // Envoi en mode texte brut (text/plain) pour éviter les blocages de sécurité (CORS) des navigateurs
            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
                body: JSON.stringify(data)
            }).then(response => {
                console.log("Données envoyées avec succès à Google Sheets.");
            }).catch(error => {
                console.error("Erreur de transmission", error);
            });
        }

        // ==========================================
        // MOTEUR PRINCIPAL DU JEU
        // ==========================================
       function renderChapter(chapterId) {
            
            // 0. REMONTER AU HAUT DE LA PAGE À CHAQUE NOUVEAU CHAPITRE
            window.scrollTo({ top: 0, behavior: 'smooth' });

            const chapter = storyData[chapterId];
            const storyText = document.getElementById('story-text');
            const choicesContainer = document.getElementById('choices-container');

            // 1. DÉTECTION DE L'INTRIGUE JOUÉE
            if (chapterId === '84') currentIntrigue = "Intrigue 1 (1917)";
            if (chapterId === '27') currentIntrigue = "Intrigue 2 (1945)";
            if (chapterId === '115') currentIntrigue = "Intrigue 3 (1964)";

            // 2. GESTION DU SCORE (Pénalité sur les impasses)
            if (chapter.text.includes("❌ IMPASSE") || chapter.text.includes("❌ ÉCHEC")) {
                playerScore -= 20;
            }
            
            // Mise à jour de l'affichage du score
            scoreDiv.innerText = "❤️ Points : " + Math.max(0, playerScore);
            
            // On affiche le score uniquement en jeu
            if(chapterId !== 'inscription' && chapterId !== 'start' && chapterId !== 'menu' && chapterId !== 'regles_dor') {
                scoreDiv.style.display = 'block';
            } else {
                scoreDiv.style.display = 'none';
            }

            // 3. DÉTECTION DU GAME OVER (Plus de points)
            if (playerScore <= 0 && chapterId !== 'game_over' && chapterId !== 'inscription') {
                sendDataToGoogle("Échec (Game Over - Plus de points)");
                renderChapter('game_over');
                return;
            }

            // 4. DÉTECTION D'UNE VICTOIRE
            if (chapter.conclusive === true && chapterId !== 'game_over') {
                sendDataToGoogle("Succès (Victoire !)");
            }

            // AFFICHAGE DU TEXTE
            storyText.innerHTML = chapter.text;
            choicesContainer.innerHTML = "";

            // 5. GESTION DU FORMULAIRE D'INSCRIPTION
            if (chapter.is_registration) {
                const nameInput = document.createElement('input');
                nameInput.placeholder = "Votre Nom et Prénom";
                nameInput.style.cssText = "width:100%; padding:15px; margin:10px 0; border-radius:8px; border:2px solid #007AC2; box-sizing:border-box; font-family:'Open Sans', sans-serif;";
                
                const emailInput = document.createElement('input');
                emailInput.type = "email";
                emailInput.placeholder = "Votre adresse e-mail";
                emailInput.style.cssText = "width:100%; padding:15px; margin:10px 0; border-radius:8px; border:2px solid #007AC2; box-sizing:border-box; font-family:'Open Sans', sans-serif;";
                
                const ageInput = document.createElement('input');
                ageInput.type = "number";
                ageInput.placeholder = "Année de naissance (ex: 1995)";
                ageInput.style.cssText = "width:100%; padding:15px; margin:10px 0 20px 0; border-radius:8px; border:2px solid #007AC2; box-sizing:border-box; font-family:'Open Sans', sans-serif;";

                const submitBtn = document.createElement('button');
                submitBtn.innerText = "Accéder au jeu";
                submitBtn.onclick = () => {
                    if (nameInput.value && emailInput.value && ageInput.value) {
                        playerName = nameInput.value;
                        playerEmail = emailInput.value;
                        playerBirthYear = ageInput.value;
                        playerScore = 100; // Initialise les points
                        currentIntrigue = "Non sélectionnée"; // Réinitialise l'intrigue
                        renderChapter('start'); // Lance l'intro du jeu
                    } else {
                        alert("Veuillez remplir tous les champs pour commencer l'aventure.");
                    }
                };

                choicesContainer.appendChild(nameInput);
                choicesContainer.appendChild(emailInput);
                choicesContainer.appendChild(ageInput);
                choicesContainer.appendChild(submitBtn);
                return; // On arrête l'exécution ici pour l'écran d'inscription
            }

            // 6. GESTION DES CHAMPS DE SAISIE LIBRE (Énigmes)
            if (chapter.text_input) {
                const inputField = document.createElement('input');
                inputField.type = "text";
                inputField.placeholder = "Saisissez votre réponse ici...";
                inputField.style.width = "100%";
                inputField.style.padding = "15px";
                inputField.style.margin = "12px 0";
                inputField.style.fontSize = "16px";
                inputField.style.borderRadius = "8px";
                inputField.style.border = "2px solid #007AC2";
                inputField.style.boxSizing = "border-box";
                inputField.style.fontFamily = "'Open Sans', Calibri, sans-serif";
                
                const submitBtn = document.createElement('button');
                submitBtn.innerText = chapter.text_input.button_text;
                submitBtn.onclick = () => {
                    const userInput = inputField.value.toLowerCase();
                    if (userInput.includes(chapter.text_input.expected.toLowerCase())) {
                        renderChapter(chapter.text_input.next_correct.toString());
                    } else {
                        renderChapter(chapter.text_input.next_incorrect.toString());
                    }
                };
                
                choicesContainer.appendChild(inputField);
                choicesContainer.appendChild(submitBtn);
            } 
           
	     // 7. GESTION CLASSIQUE DES BOUTONS DE CHOIX
	     else if (chapter.choices && chapter.choices.length > 0) {
    		// 1. On crée une copie des choix pour pouvoir les mélanger
		let choixAffichage = [...chapter.choices];

		// 2. On mélange les boutons au hasard (SAUF pour les 2 questions du quiz d'intro)
		if (chapterId !== 'quiz_1' && chapterId !== 'quiz_2') {
		for (let i = choixAffichage.length - 1; i > 0; i--) {
            
		const j = Math.floor(Math.random() * (i + 1));
		[choixAffichage[i], choixAffichage[j]] = [choixAffichage[j], choixAffichage[i]];
        }
    }

    // 3. On affiche les boutons dans le nouvel ordre aléatoire
    choixAffichage.forEach(choice => {
        const btn = document.createElement('button');
        btn.innerText = choice.text + (choice.link_text ? "\n" + choice.link_text : "");
        btn.onclick = () => renderChapter(choice.next.toString());
        choicesContainer.appendChild(btn);
    });
}
            
            // 8. BOUTON RETOUR AU MENU
            if (chapter.has_menu_button && chapterId !== 'menu' && chapterId !== 'inscription') {
                const menuBtn = document.createElement('button');
                menuBtn.className = "menu-button";
                menuBtn.innerText = "📋 Retour au menu des intrigues";
                menuBtn.onclick = () => renderChapter('menu');
                choicesContainer.appendChild(menuBtn);
            }
        }

        // LANCEMENT DU JEU SUR L'ÉCRAN D'INSCRIPTION AU DÉMARRAGE
        window.onload = () => {
            renderChapter('inscription');
        };

    </script>
