            "text": "❌ IMPASSE : Ton impatience brusque le survivant. Terrifié, il se referme sur lui-même, cache le carnet et refuse définitivement de t'adresser la parole.",
            "choices": [ { "text": "Le respect du silence est fondamental. Utilise ton Check-point.", "next": 328, "link_text": "→ Retour au Chapitre 328" } ],
            "conclusive": false, "has_menu_button": true
          },

          "344": {
            "text": "Tu ouvres le \"Testament\" d'Arthur.<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 344.  Médaille AFS.jpg\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Médaille AFS</span></div>Au milieu du chaos, les pages décrivent une vision lumineuse : Arthur propose que les ambulanciers de l'AFS soient remplacés, en temps de paix, par des étudiants internationaux. En vivant dans des familles à l'étranger, ils détruiraient l'ignorance qui cause les guerres.",
            "choices": [
              { "text": "Garder précieusement le carnet pour le montrer à la hiérarchie.", "next": 367, "link_text": "→ Chapitre 367" },
              { "text": "Penser que c'est une utopie irréalisable et le jeter au feu.", "next": 359, "link_text": "→ Chapitre 359" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "359": {
            "text": "❌ IMPASSE : En jetant le carnet par cynisme, tu détruis l'avenir de l'AFS. L'organisation sera dissoute à la fin de la guerre, faute de nouveau projet.",
            "choices": [ { "text": "Garde espoir en l'avenir. Utilise ton Check-point.", "next": 344, "link_text": "→ Retour au Chapitre 344" } ],
            "conclusive": false, "has_menu_button": true
          },

          "367": {
            "text": "Alors que tu ranges le carnet, un homme s'approche des ambulances. C'est Arthur Howe Jr., une figure historique de l'AFS, chargé d'inspecter les unités sur le front.<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 367. Arthur HOWE Jr.png\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Arthur HOWE Jr fut ambulancier AFS pendant la Seconde Guerre mondiale, et il devient Président d’ AFS International à la suite du décès de Stephen GALATII en 1964.</span></div>",
            "choices": [
              { "text": "Lui présenter immédiatement le carnet d'Arthur.", "next": 382, "link_text": "→ Chapitre 382" },
              { "text": "Cacher le carnet par méfiance envers l'état-major.", "next": 375, "link_text": "→ Chapitre 375" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "375": {
            "text": "❌ IMPASSE : En cachant le carnet, l'idée géniale d'Arthur reste ignorée de la direction. Le projet meurt dans l'œuf.",
            "choices": [ { "text": "Le partage est la force d'AFS. Utilise ton Check-point.", "next": 367, "link_text": "→ Retour au Chapitre 367" } ],
            "conclusive": false, "has_menu_button": true
          },

          "382": {
            "text": "Arthur Howe Jr. lit les pages avec émotion. Il réalise immédiatement la puissance et la nécessité absolue de cette idée pour l'après-guerre. « Jim, il faut amener cela directement à Stephen Galatti à Paris. »",
            "choices": [
              { "text": "Accepter et retourner à Paris avec lui.", "next": 413, "link_text": "→ Chapitre 413" },
              { "text": "Vouloir tout publier immédiatement dans la presse militaire.", "next": 398, "link_text": "→ Chapitre 398" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "398": {
            "text": "❌ IMPASSE : Ta fuite dans la presse militaire est mal perçue. Le dossier est censuré par les officiers qui n'y voient qu'une distraction civile. L'idée est enterrée.",
            "choices": [ { "text": "Il faut respecter la chaîne de décision. Utilise ton Check-point.", "next": 382, "link_text": "→ Retour au Chapitre 382" } ],
            "conclusive": false, "has_menu_button": true
          },

          "413": {
            "text": "Vous voici de retour à Paris, au QG européen de l'AFS. Le moment est historique. Vous devez convaincre Stephen Galatti d'abandonner la glorieuse histoire des ambulances pour créer des bourses étudiantes (les fameuses Scholarships).<div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 413. Macaron AFS Scholarship papier.jpg\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"><br><span style=\"font-size: 13px; font-style: italic; color: #555;\">Ecusson présentant les bourses AFS pour des programmes de mobilité internationale</span></div>",
            "choices": [
              { "text": "Aller défendre le projet en personne devant Galatti.", "next": 435, "link_text": "→ Chapitre 435" },
              { "text": "Envoyer le carnet par le courrier ordinaire pour qu'il le lise seul.", "next": 421, "link_text": "→ Chapitre 421" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "421": {
            "text": "❌ IMPASSE : Dans la désorganisation de l'après-guerre, le carnet envoyé par courrier est égaré dans les méandres des archives militaires. Le destin d'AFS s'évanouit.",
            "choices": [ { "text": "Certains messages doivent être portés à la main. Utilise ton Check-point.", "next": 413, "link_text": "→ Retour au Chapitre 413" } ],
            "conclusive": false, "has_menu_button": true
          },

          "435": {
            "text": "Tu te tiens face à Stephen Galatti et à un comité d'anciens chauffeurs sceptiques. Changer l'ADN de l'AFS est un saut dans le vide. Tu dois choisir tes arguments.",
            "choices": [
              { "text": "Utiliser l'empathie et raconter l'horreur de Bergen-Belsen.", "next": 457, "link_text": "→ Chapitre 457" },
              { "text": "Utiliser des arguments cyniques et purement financiers.", "next": 442, "link_text": "→ Chapitre 442" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "442": {
            "text": "❌ IMPASSE : Galatti est profondément déçu par ton cynisme. L'AFS est une association de cœur, pas une entreprise. Il rejette ta proposition.",
            "choices": [ { "text": "Parle avec ton âme, pas avec ton portefeuille. Utilise ton Check-point.", "next": 435, "link_text": "→ Retour au Chapitre 435" } ],
            "conclusive": false, "has_menu_button": true
          },

          "457": {
            "text": "La voix tremblante, tu racontes les fosses de Bergen-Belsen. Tu leur expliques que l'ignorance, la peur de l'autre et le manque de dialogue mènent à la déshumanisation absolue. Faire voyager des jeunes pour se comprendre est le seul remède.",
            "choices": [
              { "text": "Garder un ton posé et solennel pour finir ton discours.", "next": 479, "link_text": "→ Chapitre 479" },
              { "text": "Devenir agressif et hurler sur le comité pour les secouer.", "next": 464, "link_text": "→ Chapitre 464" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "464": {
            "text": "❌ IMPASSE : Ton agressivité braque les anciens conducteurs, qui te prennent pour un fou furieux traumatisé par la guerre. Le vote est unanime contre le projet.",
            "choices": [ { "text": "La diplomatie convainc mieux que la rage. Utilise ton Check-point.", "next": 457, "link_text": "→ Retour au Chapitre 457" } ],
            "conclusive": false, "has_menu_button": true
          },

          "479": {
            "text": "Un lourd silence pèse dans la pièce. Puis, Stephen Galatti se lève, les larmes aux yeux, et valide l'idée ! <div style=\"text-align: center; margin: 15px 0;\"><img src=\"Chap 479. Programmes AFS Internatuonal Scholarships.jpg\" style=\"max-width: 100%; width: 450px; border-radius: 8px;\"></div> C'est la naissance historique du programme d'échange étudiant mondial AFS (1946-1947).",
            "choices": [
              { "text": "Accepter de participer activement à la création de ce programme.", "next": 491, "link_text": "→ Chapitre 491" },
              { "text": "Refuser de t'impliquer davantage pour rentrer chez toi aux USA.", "next": 483, "link_text": "→ Chapitre 483" }
            ],
            "conclusive": false, "has_menu_button": true
          },

          "483": {
            "text": "❌ IMPASSE : En refusant de t'impliquer pour l'avenir, le projet manque de bras. La création du réseau prend des années de retard.",
            "choices": [ { "text": "L'engagement se poursuit en temps de paix. Utilise ton Check-point.", "next": 479, "link_text": "→ Retour au Chapitre 479" } ],
            "conclusive": false, "has_menu_button": true
          },

          "491": {
            "text": "Galatti te propose de devenir l'un des tout premiers pionniers de ce nouveau projet humaniste. Ta décision va changer le cours de ta vie et celui de millions de jeunes étudiants à venir.",
            "choices": [
              { "text": "Je veux rentrer au siège à New York pour diriger la campagne.", "next": 538, "link_text": "→ Chapitre 538" },
              { "text": "Je veux rester en France pour être la première famille d'accueil.", "next": 552, "link_text": "→ Chapitre 552" }
            ],
            "conclusive": false, "has_menu_button": true
          },

 "538": {
            "text": "🌟 FINALE GAGNANTE A : L'AMBASSADEUR DE LA PAIX<br><br>Tu rentres à New York aux côtés de Galatti. Grâce à ton énergie, vous lancez la première grande campagne de bourses d'études franco-américaines (Scholarships) en 1947. Tu as honoré la mémoire d'Arthur : la haine de la guerre s'est transformée en une quête mondiale pour la compréhension et la paix.<br><br><h3 style='color: #FF7900; margin-top: 0;'>🎁 ARCHIVES DÉBLOQUÉES</h3>Félicitations pour avoir mené à bien cette mission de la Seconde Guerre Mondiale ! Découvrez ces témoignages historiques :<br>👉 <a href='https://drive.google.com/file/d/1amzUXgul8mXk0DfJJUrq9JfiKOI6QcPv/view?usp=sharing' target='_blank' style='color: #FF7900; font-weight: bold;'>Témoignage de Raymond Aubrac (2008)</a><br>👉 <a href='https://drive.google.com/file/d/1VlbWgCjNtexVi-mDs3S9IXVkaHqM12Pz/view?usp=sharing' target='_blank' style='color: #FF7900; font-weight: bold;'>Témoignage d'Arthur Howe, Jr.</a><br>👉 <a href='https://drive.google.com/file/d/1Ug-4cg7sDZ5XZBalcsg-Gw3dRAltSw3_/view?usp=sharing' target='_blank' style='color: #FF7900; font-weight: bold;'>AFS Letter from Libya (Vidéo)</a><br>👉 <a href='https://drive.google.com/file/d/1-IvXWGVc1Fj3OMnJXs0FBqUI19Fdwevw/view?usp=sharing' target='_blank' style='color: #FF7900; font-weight: bold;'>AFS in India-Burma (Vidéo)</a>",
            "choices": [],
            "conclusive": true, "has_menu_button": true
          },

          "552": {
            "text": "🌟 FINALE GAGNANTE B : LE VOLONTAIRE DE TERRAIN<br><br>Marqué à jamais par la souffrance de l'Europe, tu décides de t'installer en France. Quelques mois plus tard, tu ouvres ta porte au tout premier étudiant étranger AFS. Tu deviens la première \"famille d'accueil\" du réseau. La fraternité née dans la boue et le sang a fait éclore une paix durable, foyer après foyer.<br><br><h3 style='color: #FF7900; margin-top: 0;'>🎁 ARCHIVES DÉBLOQUÉES</h3>Félicitations pour avoir mené à bien cette mission de la Seconde Guerre Mondiale ! Découvrez ces témoignages historiques :<br>👉 <a href='https://drive.google.com/file/d/1amzUXgul8mXk0DfJJUrq9JfiKOI6QcPv/view?usp=sharing' target='_blank' style='color: #FF7900; font-weight: bold;'>Témoignage de Raymond Aubrac (2008)</a><br>👉 <a href='https://drive.google.com/file/d/1VlbWgCjNtexVi-mDs3S9IXVkaHqM12Pz/view?usp=sharing' target='_blank' style='color: #FF7900; font-weight: bold;'>Témoignage d'Arthur Howe, Jr.</a><br>👉 <a href='https://drive.google.com/file/d/1Ug-4cg7sDZ5XZBalcsg-Gw3dRAltSw3_/view?usp=sharing' target='_blank' style='color: #FF7900; font-weight: bold;'>AFS Letter from Libya (Vidéo)</a><br>👉 <a href='https://drive.google.com/file/d/1-IvXWGVc1Fj3OMnJXs0FBqUI19Fdwevw/view?usp=sharing' target='_blank' style='color: #FF7900; font-weight: bold;'>AFS in India-Burma (Vidéo)</a>",
            "choices": [],
            "conclusive": true, "has_menu_button": true
          },



          /* ================================================================= */
          /* INTRIGUE 3 : L'ESPRIT CARTÉSIEN DANS LE MIDWEST (1964) (51 CHAPITRES) */
          /* ================================================================= */

          "115": {
            "text": "Août 1964. Tu incarnes Nicole (surnommée Bibi), 18 ans. Lors de la longue traversée de l'Atlantique sur le *M/S Seven Seas*, au milieu des embruns salés et des 925 autres étudiants AFS, l'ambiance est effervescente.<div style='text-align: center; margin: 15px 0;'><img src='Chap 115. Groupe AFS sur le Seven Seas 1965.tif' style='max-width: 100%; width: 450px; border-radius: 8px;'><br><span style='font-size: 13px; font-style: italic; color: #555;'>Jeunes AFS sur le bateau \"Seven Seas\" les menant aux Etats-Unis (août 1965)</span></div>Tu viens de rencontrer un groupe d'étudiants internationaux. Ils débattent passionnément de la politique américaine sur le pont supérieur.",
            "choices": [
              { "text": "Rejoindre le débat et te faire des amis internationaux.", "next": 601, "link_text": "→ Chapitre 601" },
              { "text": "T'isoler dans ta cabine pour te reposer avant l'arrivée.", "next": 602, "link_text": "→ Chapitre 602" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "602": {
            "text": "❌ IMPASSE : En t'isolant dans ta cabine pendant toute la traversée, tu passes à côté de l'essence même de l'AFS : la rencontre. Tu arrives à New York sans aucun allié.",
            "choices": [ { "text": "Le voyage est aussi important que la destination. Utilise ton Check-point.", "next": 115, "link_text": "→ Retour au Chapitre 115" } ],
            "conclusive": false, "has_menu_button": true
          },
          "601": {
            "text": "Sur le pont, tu te lies d'amitié avec un trio inséparable : Yumi (Japonaise), Mateo (Chilien) et Tariq (Égyptien). Votre lien devient indéfectible.<div style='text-align: center; margin: 15px 0;'><img src='Chap 718. AFS Français sur le Seven Seas ( 07.1962).jpg' style='max-width: 100%; width: 450px; border-radius: 8px;'><br><span style='font-size: 13px; font-style: italic; color: #555;'>Jeunes AFS sur le bateau Seven Seas, juillet 1962</span></div>Quelques jours plus tard, le navire accoste à New York. Devant l'immensité des gratte-ciel, le choc est total. AFS vous donne une journée libre avant de prendre le train pour vos familles d'accueil.",
            "choices": [
              { "text": "Partir explorer Manhattan avec ton nouveau groupe.", "next": 603, "link_text": "→ Chapitre 603" },
              { "text": "Rester sagement à l'hôtel pour éviter de te perdre.", "next": 606, "link_text": "→ Chapitre 606" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "606": {
            "text": "❌ IMPASSE : La peur de l'inconnu te paralyse. Tu restes à l'hôtel pendant que tes amis vivent des moments inoubliables. Tu commences ton année avec des regrets.",
            "choices": [ { "text": "L'audace est la clé de l'échange. Utilise ton Check-point.", "next": 601, "link_text": "→ Retour au Chapitre 601" } ],
            "conclusive": false, "has_menu_button": true
          },
          "603": {
            "text": "Manhattan vous étourdit. Le lendemain, tu prends le train pour Springfield, dans le Missouri. À la gare, tu rencontres les Bauer, ta famille d'accueil. L'allée de leur maison est barrée par une luxueuse Mercury rutilante. L'air sent la cire et le rôti. Avant le dîner, Madame Bauer te propose de l'accompagner au grand supermarché local pour faire quelques courses.",
            "choices": [
              { "text": "Accepter avec enthousiasme pour découvrir la vie locale.", "next": 664, "link_text": "→ Chapitre 664" },
              { "text": "Refuser poliment, préférant défaire tes valises.", "next": 665, "link_text": "→ Chapitre 665" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "665": {
            "text": "❌ IMPASSE : En refusant de l'accompagner, Madame Bauer te trouve distante et capricieuse. Le fossé se creuse dès le premier jour.",
            "choices": [ { "text": "La curiosité est indispensable. Utilise ton Check-point.", "next": 603, "link_text": "→ Retour au Chapitre 603" } ],
            "conclusive": false, "has_menu_button": true
          },
          "664": {
            "text": "Le supermarché est gigantesque, un temple de la consommation qui te fascine. Mais au détour d'une allée, tu remarques que les clients noirs sont servis différemment, tenus à l'écart avec mépris par les caissiers. Le malaise t'envahit face à cette ségrégation silencieuse.",
            "choices": [
              { "text": "Poser discrètement des questions à Mme Bauer sur le chemin du retour.", "next": 666, "link_text": "→ Chapitre 666" },
              { "text": "Faire un scandale immédiat à la caisse au nom des droits de l'homme.", "next": 667, "link_text": "→ Chapitre 667" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "667": {
            "text": "❌ IMPASSE : Ton esclandre choque profondément la communauté locale. Madame Bauer, mortifiée, demande ton renvoi immédiat de sa famille.",
            "choices": [ { "text": "Comprendre avant de juger. Utilise ton Check-point.", "next": 664, "link_text": "→ Retour au Chapitre 664" } ],
            "conclusive": false, "has_menu_button": true
          },
          "666": {
            "text": "Dans la voiture, Madame Bauer se crispe à tes questions. « Ce sont nos affaires locales, Bibi. *Be a good girl*, ne te mêle pas de ça. »<div style='text-align: center; margin: 15px 0;'><img src='Chap 731. Sénéchal Marie-Hélène n° 1 1961-1962.jpg' style='max-width: 100%; width: 450px; border-radius: 8px;'><br><span style='font-size: 13px; font-style: italic; color: #555;'>Photo de Marie-Hélène Sénéchal (jeune française partie avec AFS en 1961-1962)</span></div>Le soir venu, la famille se réunit pour le dîner. L'atmosphère est étouffante.",
            "choices": [
              { "text": "Manger avec eux devant la télévision.", "next": 607, "link_text": "→ Chapitre 607" },
              { "text": "Refuser de manger pour marquer ton désaccord politique.", "next": 608, "link_text": "→ Chapitre 608" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "608": {
            "text": "❌ IMPASSE : Ton refus obstiné de manger est perçu comme une insulte insupportable à leur hospitalité. Tu es consignée dans ta chambre.",
            "choices": [ { "text": "Garde le dialogue ouvert. Utilise ton Check-point.", "next": 666, "link_text": "→ Retour au Chapitre 666" } ],
            "conclusive": false, "has_menu_button": true
          },
          "607": {
            "text": "Le premier dîner se fait sur des plateaux-repas en plastique, dans la lueur crue de la télévision. Tu es atterrée par la vacuité des programmes. Le père, Monsieur Bauer, semble fasciné par une publicité pour des tondeuses à gazon.",
            "choices": [
              { "text": "Observer passivement pour analyser leur culture familiale.", "next": 609, "link_text": "→ Chapitre 609" },
              { "text": "Éteindre la télévision d'autorité pour les forcer à discuter.", "next": 611, "link_text": "→ Chapitre 611" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "611": {
            "text": "❌ IMPASSE : En éteignant leur télévision d'autorité, tu commets un crime de lèse-majesté dans un foyer américain des années 60. Ils te jugent tyrannique et arrogante.",
            "choices": [ { "text": "L'observation est la première étape. Utilise ton Check-point.", "next": 607, "link_text": "→ Retour au Chapitre 607" } ],
            "conclusive": false, "has_menu_button": true
          },
          "609": {
            "text": "Tu observes en silence, notant l'importance de ce confort matériel pour eux. Le dimanche arrive. Les Bauer, engoncés dans leurs beaux habits, t'emmènent à l'église baptiste locale. Le sermon du pasteur fait l'éloge de l'obéissance, de la conformité sociale et de la méfiance envers les agitateurs.",
            "choices": [
              { "text": "Sourire poliment et serrer des mains à la sortie.", "next": 612, "link_text": "→ Chapitre 612" },
              { "text": "Critiquer ouvertement le pasteur sur le parvis de l'église.", "next": 613, "link_text": "→ Chapitre 613" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "613": {
            "text": "❌ IMPASSE : Attaquer le pasteur le dimanche matin est un suicide social à Springfield. Tu es définitivement mise au ban de la communauté.",
            "choices": [ { "text": "La diplomatie demande de la retenue. Utilise ton Check-point.", "next": 609, "link_text": "→ Retour au Chapitre 609" } ],
            "conclusive": false, "has_menu_button": true
          },
          "612": {
            "text": "Lundi. Premier jour à la *Central High School*. Dans les couloirs immenses résonnant du fracas métallique des casiers, tu aperçois Ruby, une élève noire, en larmes. Ses cahiers sont au sol. Chad, un garçon blond arborant le blouson rouge des *Kiltie Girls* (la fanfare), vient de la bousculer et de lui voler son journal intime.",
            "choices": [
              { "text": "Courir chercher tes amis AFS pour l'aider.", "next": 614, "link_text": "→ Chapitre 614" },
              { "text": "Détourner le regard et fuir vers ta salle de classe.", "next": 616, "link_text": "→ Chapitre 616" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "616": {
            "text": "❌ IMPASSE : Le goût métallique de la lâcheté dans la bouche, tu tournes les talons. Tu passe à côté de la dimension humaniste de ton échange.",
            "choices": [ { "text": "Ne détourne pas le regard face à l'injustice. Utilise ton Check-point.", "next": 612, "link_text": "→ Retour au Chapitre 612" } ],
            "conclusive": false, "has_menu_button": true
          },
          "614": {
            "text": "Tu retrouves Yumi, Mateo et Tariq près de la bibliothèque. Tu leur proposes d'agir. Mais Yumi baisse les yeux, terrifiée à l'idée de défier l'ordre établi ; Tariq a peur pour son visa ; et Mateo te trouve trop autoritaire.",
            "choices": [
              { "text": "Ravaler ton orgueil et écouter leurs craintes avec empathie.", "next": 617, "link_text": "→ Chapitre 617" },
              { "text": "Les traiter de lâches et d'abrutis.", "next": 618, "link_text": "→ Chapitre 618" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "618": {
            "text": "❌ IMPASSE : Les joues brûlantes, tu les insultes. Ton groupe se disloque. Seule contre tous, tu n'arriveras à rien.",
            "choices": [ { "text": "L'union fait la force. Utilise ton Check-point.", "next": 614, "link_text": "→ Retour au Chapitre 614" } ],
            "conclusive": false, "has_menu_button": true
          },
          "617": {
            "text": "Tu prends le temps de les écouter. La tension retombe et l'alliance internationale se ressoude. Vous décidez d'enquêter prudemment sur Chad.",
            "choices": [
              { "text": "Aller à la cafétéria pour observer ses habitudes.", "next": 668, "link_text": "→ Chapitre 668" },
              { "text": "Abandonner l'enquête et aller pleurer aux toilettes.", "next": 670, "link_text": "→ Chapitre 670" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "670": {
            "text": "❌ IMPASSE : Pleurer ne résout rien. Les jours passent, Ruby est expulsée pour avoir perdu ses devoirs contenus dans le journal, et tu n'as rien fait.",
            "choices": [ { "text": "Sèche tes larmes et agis. Utilise ton Check-point.", "next": 617, "link_text": "→ Retour au Chapitre 617" } ],
            "conclusive": false, "has_menu_button": true
          },
          "668": {
            "text": "À la cafétéria, le bruit est assourdissant. Chad est à la table des élèves populaires, entouré des filles de la fanfare. Ruby, elle, mange seule dans un coin sombre.",
            "choices": [
              { "text": "Aller t'asseoir à côté de Ruby pour gagner sa confiance.", "next": 669, "link_text": "→ Chapitre 669" },
              { "text": "Aller t'imposer à la table de Chad pour l'intimider.", "next": 671, "link_text": "→ Chapitre 671" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "671": {
            "text": "❌ IMPASSE : Les élèves populaires se moquent de ton accent et te jettent des restes de nourriture. Tu es humiliée publiquement et tu ne récoltes aucune information.",
            "choices": [ { "text": "La subtilité est nécessaire. Utilise ton Check-point.", "next": 668, "link_text": "→ Retour au Chapitre 668" } ],
            "conclusive": false, "has_menu_button": true
          },
          "669": {
            "text": "Tu t'assois près de Ruby. Émue par ton soutien, elle t'avoue que Chad cache souvent ses 'trophées' volés dans son propre casier ou dans le coffre de sa voiture. La cloche sonne : c'est l'heure du cours d'Histoire.",
            "choices": [
              { "text": "Te rendre en cours d'Histoire avec tes amis.", "next": 620, "link_text": "→ Chapitre 620" },
              { "text": "Attaquer Chad physiquement dans le couloir.", "next": 621, "link_text": "→ Chapitre 621" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "621": {
            "text": "❌ IMPASSE : Ton agression physique te vaut une convocation immédiate chez le proviseur. Tu es renvoyée chez les Bauer avec un blâme sévère.",
            "choices": [ { "text": "Garde ton sang-froid. Utilise ton Check-point.", "next": 669, "link_text": "→ Retour au Chapitre 669" } ],
            "conclusive": false, "has_menu_button": true
          },
          "620": {
            "text": "En cours, le professeur d'Histoire brosse un portrait idyllique et révisionniste des États du Sud, minimisant l'esclavage. Tariq serre les poings, outré.",
            "choices": [
              { "text": "Faire taire ton indignation pour ne pas te faire repérer.", "next": 622, "link_text": "→ Chapitre 622" },
              { "text": "Hurler sur le professeur en dénonçant sa propagande.", "next": 625, "link_text": "→ Chapitre 625" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "625": {
            "text": "❌ IMPASSE : Ton éclat de voix perturbe le cours. Le professeur t'envoie en retenue (detention) pour le reste de la semaine, t'empêchant de poursuivre ton enquête.",
            "choices": [ { "text": "La fin justifie parfois le silence. Utilise ton Check-point.", "next": 620, "link_text": "→ Retour au Chapitre 620" } ],
            "conclusive": false, "has_menu_button": true
          },
          "622": {
            "text": "À la fin des cours, les couloirs se vident. C'est le moment d'inspecter les cachettes de Chad. Par quoi commencer ?",
            "choices": [
              { "text": "Fouiller le casier de Chad dans le hall principal.", "next": 623, "link_text": "→ Chapitre 623" },
              { "text": "Tenter de fracturer le casier avec un pied-de-biche.", "next": 672, "link_text": "→ Chapitre 672" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "672": {
            "text": "❌ IMPASSE : Le bruit de la tôle fracassée attire le proviseur. Prise en flagrant délit de vandalisme, l'aventure s'arrête ici.",
            "choices": [ { "text": "Ne sois pas brutale. Utilise ton Check-point.", "next": 622, "link_text": "→ Retour au Chapitre 622" } ],
            "conclusive": false, "has_menu_button": true
          },
          "623": {
            "text": "Le casier est fermé par un cadenas à code. Le vieux concierge passe la serpillière à côté. Avec ton charme français, tu l'abordes.",
            "choices": [
              { "text": "Lui glisser une authentique pièce de monnaie française en souvenir.", "next": 624, "link_text": "→ Chapitre 624" },
              { "text": "L'insulter pour qu'il ouvre le casier par la peur.", "next": 628, "link_text": "→ Chapitre 628" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "628": {
            "text": "❌ IMPASSE : Le vieux concierge se fâche rouge, appelle la sécurité et te fait expulser du bâtiment.",
            "choices": [ { "text": "La courtoisie ouvre bien des portes. Utilise ton Check-point.", "next": 623, "link_text": "→ Retour au Chapitre 623" } ],
            "conclusive": false, "has_menu_button": true
          },
          "624": {
            "text": "Émerveillé par la pièce, il t'ouvre le casier. Vide. Ruby avait raison : le journal est sûrement dans la voiture de Chad. Pour l'approcher, tu décides de t'infiltrer chez les Kiltie Girls. Dans leurs vestiaires, l'odeur de laque est suffocante.",
            "choices": [
              { "text": "Refuser de mettre les bigoudis et garder ton naturel français.", "next": 718, "link_text": "→ Chapitre 718" },
              { "text": "Accepter d'être laquée et maquillée comme une poupée.", "next": 631, "link_text": "→ Chapitre 631" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "631": {
            "text": "❌ IMPASSE : Étouffée sous la laque, tu deviens une copie américaine conforme. Tu oublies ta mission et tu te perds dans les ragots.",
            "choices": [ { "text": "Garde ton authenticité. Utilise ton Check-point.", "next": 624, "link_text": "→ Retour au Chapitre 624" } ],
            "conclusive": false, "has_menu_button": true
          },
          "718": {
            "text": "Tu retires sèchement les bigoudis. Tes cheveux retombent naturellement. Cette rébellion stylistique attire le regard de Chad. Fasciné par ton arrogance, il t'invite à faire un tour dans son bolide.",
            "choices": [
              { "text": "Accepter le \"date\" pour le distraire pendant que tes amis agissent.", "next": 630, "link_text": "→ Chapitre 630" },
              { "text": "Le gifler immédiatement pour son attitude arrogante.", "next": 731, "link_text": "→ Chapitre 731" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "731": {
            "text": "❌ IMPASSE : Le son de ta main claquant sur sa joue résonne. Furieux, il te jette hors de la voiture. L'enquête est morte.",
            "choices": [ { "text": "Garde ton sang-froid stratégique. Utilise ton Check-point.", "next": 718, "link_text": "→ Retour au Chapitre 718" } ],
            "conclusive": false, "has_menu_button": true
          },
          "630": {
            "text": "Dans la voiture, tu l'embobines avec une joute verbale brillante. Pendant qu'il va chercher des milk-shakes, Mateo et Tariq surgissent, fouillent la boîte à gants et récupèrent le journal de Ruby !",
            "choices": [
              { "text": "Attendre le repas de Thanksgiving pour lire le journal au calme.", "next": 634, "link_text": "→ Chapitre 634" },
              { "text": "Vous vanter bruyamment de ce vol dans les couloirs.", "next": 673, "link_text": "→ Chapitre 673" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "673": {
            "text": "❌ IMPASSE : En te vantant, le proviseur vous entend. Accusés de vol aggravé, vous êtes expulsés avant d'avoir pu aider Ruby.",
            "choices": [ { "text": "La discrétion est une vertu. Utilise ton Check-point.", "next": 630, "link_text": "→ Retour au Chapitre 630" } ],
            "conclusive": false, "has_menu_button": true
          },
          "634": {
            "text": "Novembre. Dans le journal de Ruby, vous découvrez l'adresse locale de la NAACP (association de défense des droits civiques). Le soir même a lieu le grand dîner de Thanksgiving chez les Bauer. Soudain, un oncle de la famille affirme bruyamment que le Général de Gaulle est un dangereux communiste.",
            "choices": [
              { "text": "Démonter l'argument calmement avec ton esprit cartésien.", "next": 788, "link_text": "→ Chapitre 788" },
              { "text": "Faire trembler la table en hurlant de colère.", "next": 639, "link_text": "→ Chapitre 639" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "639": {
            "text": "❌ IMPASSE : Ton explosion de rage choque l'assemblée. Mme Bauer manque de s'étouffer. L'incident diplomatique est total.",
            "choices": [ { "text": "Le calme fait la force. Utilise ton Check-point.", "next": 634, "link_text": "→ Retour au Chapitre 634" } ],
            "conclusive": false, "has_menu_button": true
          },
          "788": {
            "text": "Avec une précision chirurgicale, tu démontes l'argument de l'oncle. Ton esprit cartésien force le respect. Le lendemain, forts de cette cohésion intellectuelle, vous portez le journal à l'antenne locale de la NAACP.<div style='text-align: center; margin: 15px 0;'><img src='Chap 788. NAACP.jpg' style='max-width: 100%; width: 450px; border-radius: 8px;'></div>Les militants vous dévisagent avec méfiance : ils ne veulent pas de touristes sociaux.",
            "choices": [
              { "text": "Accepter de répondre à leur question historique pour prouver votre sérieux.", "next": 801, "link_text": "→ Chapitre 801" },
              { "text": "Refuser leur test par fierté mal placée.", "next": 642, "link_text": "→ Chapitre 642" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "642": {
            "text": "❌ IMPASSE : Froissée, tu refuses. Les militants vous jugent arrogants et ferment leur porte.",
            "choices": [ { "text": "Baisse la garde face à tes alliés. Utilise ton Check-point.", "next": 788, "link_text": "→ Retour au Chapitre 788" } ],
            "conclusive": false, "has_menu_button": true
          },
          "801": {
            "text": "★ ÉNIGME HISTORIQUE ★<br><br>Le chef croise les bras. Pour prouver que vous comprenez leur lutte, tu dois lui donner le nom exact de la loi historique signée cette même année 1964 par le Président Johnson pour abolir la ségrégation.<div style='text-align: center; margin: 15px 0;'><img src='Chap 801. President Lyndon B. Johnson Civil rights act 1964.jpg' style='max-width: 100%; width: 450px; border-radius: 8px;'><br><span style='font-size: 13px; font-style: italic; color: #555;'>Signature en 1964 par le Président Jonhson</span></div>Saisis le nom (en anglais) de cette loi ci-dessous :",
            "text_input": {
              "expected": "civil rights",
              "next_correct": 827,
              "next_incorrect": 814,
              "button_text": "Valider ma réponse"
            },
            "choices": [],
            "conclusive": false,
            "has_menu_button": true
          },
          "814": {
            "text": "❌ IMPASSE : Mauvaise réponse. Déçus, les militants vous demandent de partir. Vous n'êtes que des ignorants à leurs yeux.",
            "choices": [ { "text": "L'Histoire est ton arme. Utilise ton Check-point.", "next": 801, "link_text": "→ Retour à l'énigme" } ],
            "conclusive": false, "has_menu_button": true
          },
          "827": {
            "text": "Le regard du militant s'éclaire. Acceptés comme de véritables alliés, vous apprenez qu'un grand sit-in est organisé devant le lycée le lendemain matin.<div style='text-align: center; margin: 15px 0;'><img src='Chap 827. Goldwater button In your heart you know he's right.jpeg' style='max-width: 100%; width: 450px; border-radius: 8px;'><br><span style='font-size: 13px; font-style: italic; color: #555;'>Pin's du candidat démocrate Barry Goldwater</span></div>Mais le soir, Monsieur Bauer, tapotant son pin's de Barry Goldwater, t'interdit formellement de te mêler de ces agitations.",
            "choices": [
              { "text": "Braver l'interdit et rejoindre Ruby avec tes amis AFS.", "next": 648, "link_text": "→ Chapitre 648" },
              { "text": "Obéir sagement aux règles baptistes de la maison.", "next": 649, "link_text": "→ Chapitre 649" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "649": {
            "text": "❌ IMPASSE : Tu restes assise sagement sur le canapé pendant que, dehors, Ruby marche seule. Le poids de ta trahison t'étouffe.",
            "choices": [ { "text": "Les grandes causes exigent des risques. Utilise ton Check-point.", "next": 827, "link_text": "→ Retour au Chapitre 827" } ],
            "conclusive": false, "has_menu_button": true
          },
          "648": {
            "text": "Le cœur battant, tu fuis la maison à l'aube. Devant les grilles du lycée, l'air est électrique. Vous formez un bouclier humain autour de Ruby. Chad rameute ses amis et hurle à la foule que vous êtes des agitateurs communistes.",
            "choices": [
              { "text": "Faire front et laisser le groupe AFS répondre collectivement.", "next": 916, "link_text": "→ Chapitre 916" },
              { "text": "Fuir la manifestation par peur de la police locale.", "next": 654, "link_text": "→ Chapitre 654" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "654": {
            "text": "❌ IMPASSE : Tu tournes les talons, abandonnant Ruby au milieu des hurlements. L'injustice triomphe.",
            "choices": [ { "text": "Ne recule pas dans la dernière ligne droite. Utilise ton Check-point.", "next": 648, "link_text": "→ Retour au Chapitre 648" } ],
            "conclusive": false, "has_menu_button": true
          },
          "916": {
            "text": "★ ÉNIGME HISTORIQUE (BOUTONS) ★<br><br>La foule hostile se resserre. Dans cette tension suffocante, comment votre groupe réagit-il pour soutenir Ruby et désamorcer la haine sans braquer tout le Midwest américain ?",
            "choices": [
              { "text": "Vous criez que ce pays n'a pas d'âme et n'est rempli que d'ignorants.", "next": 659, "link_text": "→ Chapitre 659" },
              { "text": "Vous vous unissez pour parler de justice et de l'idéal américain d'égalité.", "next": 658, "link_text": "→ Chapitre 658" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "659": {
            "text": "❌ IMPASSE : L'insulte agit comme une étincelle. La manifestation dégénère en émeute. Vous êtes rapatriés d'urgence par AFS.",
            "choices": [ { "text": "L'insulte n'est jamais la bonne méthode AFS. Utilise ton Check-point.", "next": 916, "link_text": "→ Retour à l'énigme" } ],
            "conclusive": false, "has_menu_button": true
          },
          "658": {
            "text": "Un silence majestueux tombe. D'un ton acéré et brillant, tu invoques l'égalité de tous. Chad recule, désarmé. Le proviseur arrive enfin, attiré par le calme soudain. Il exige des explications.",
            "choices": [
              { "text": "Lui remettre le journal de Ruby comme preuve du vol.", "next": 934, "link_text": "→ Finale A" },
              { "text": "Faire un discours mémorable sur les fondements de la démocratie.", "next": 951, "link_text": "→ Finale B" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "934": {
            "text": "🌟 FINALE GAGNANTE A (L'Héroïne de l'Égalité) <br><br>Le journal rendu et l'agression exposée au grand jour, Chad est suspendu par une direction qui ne peut plus ignorer les faits. Chez les Bauer, le dîner du soir est silencieux, mais les regards ont changé : derrière le choc de ta rébellion, perce l'admiration secrète de Monsieur Bauer pour votre courage indomptable. Vous avez prouvé à Springfield que le véritable échange interculturel ne consiste pas seulement à partager des recettes de cuisine, mais à s'unir, par-delà les frontières, pour refuser l'injustice.",
            "choices": [],
            "conclusive": true, "has_menu_button": true
          },
          "951": {
            "text": "🌟 FINALE GAGNANTE B (L'Esprit Cartésien Respecté) <br><br>Votre discours magistral résonne bien au-delà des murs de la *Central High School*. La rumeur d'une jeunesse étrangère brillante s'est répandue. Loin du cliché condescendant de la Française au sang chaud, ton équipe a imposé le respect de tout un pan du Midwest par sa rigueur intellectuelle et sa noblesse morale. L'écho parvient jusqu'à la capitale : au printemps suivant, une lettre sur papier à en-tête arrive chez les Bauer. Le gouverneur du Missouri vous félicite en personne pour avoir rappelé à ses concitoyens les fondements mêmes de leur démocratie.",
            "choices": [],
            "conclusive": true, "has_menu_button": true
          },


          /* ================================================================= */
          /* INTRIGUE 4 : LA DISPARUE DE SALVADOR (1977) (52 CHAPITRES)        */
          /* ================================================================= */

          "42": {
            "text": "<b>FÉVRIER 1977</b><br><br>Tu incarnes Béatrice, 17 ans. Il y a à peine trois semaines, tu te voyais déjà caresser des kangourous en Australie. Mais une bourse d'excellence d'AFS en a décidé autrement : destination le Brésil ! Tu atterris à Recife, désorientée. Tu ne parles pas un mot de portugais et tu ignores tout de la chape de plomb qui écrase le pays : la féroce dictature militaire. Dès la descente de l'avion, la chaleur moite te frappe comme un mur. Dans ta famille d'accueil, l'ambiance est protectrice. Ta sœur d'accueil, Camila, a 20 ans. Elle a un rire éclatant et se montre immédiatement très chaleureuse envers toi.",
            "choices": [
              { "text": "Accepter son accueil et passer la soirée avec elle.", "next": 402, "link_text": "→ Chapitre 402" },
              { "text": "T'enfermer dans ta chambre, épuisée par le décalage.", "next": 401, "link_text": "→ Chapitre 401" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "401": {
            "text": "❌ IMPASSE : En t'isolant dès le premier jour, tu refuses le lien humain. Camila te juge distante. Tu commences ton année d'échange dans la solitude.",
            "choices": [ { "text": "L'échange exige d'aller vers l'autre. Utilise ton Check-point.", "next": 42, "link_text": "→ Retour au Chapitre 42" } ],
            "conclusive": false, "has_menu_button": true
          },
          "402": {
            "text": "Le soir, lors de ton premier dîner familial, l'atmosphère est lourde de non-dits. Les parents parlent à voix basse. La télévision crache de la propagande militaire que personne ne commente. Camila t'offre un plat traditionnel, la *feijoada*.",
            "choices": [
              { "text": "Goûter le plat avec curiosité malgré l'aspect inhabituel.", "next": 404, "link_text": "→ Chapitre 404" },
              { "text": "Refuser de manger car tu ne connais pas les ingrédients.", "next": 403, "link_text": "→ Chapitre 403" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "403": {
            "text": "❌ IMPASSE : Ton refus catégorique est perçu comme un rejet de leur culture. La famille est vexée et le dîner se termine dans un froid glacial.",
            "choices": [ { "text": "Fais preuve d'ouverture d'esprit. Utilise ton Check-point.", "next": 402, "link_text": "→ Retour au Chapitre 402" } ],
            "conclusive": false, "has_menu_button": true
          },
          "404": {
            "text": "Le lendemain, Camila t'emmène au grand marché de São José. L'endroit grouille de vie, de couleurs et d'odeurs intenses. Une femme s'approche pour te vendre des bracelets et te touche familièrement le bras, son visage à quelques centimètres du tien. L'espace proxémique brésilien te déroute complètement.",
            "choices": [
              { "text": "Reculer d'un pas et laisser Camila gérer la situation.", "next": 408, "link_text": "→ Chapitre 408" },
              { "text": "Repousser violemment la vendeuse en criant en français.", "next": 406, "link_text": "→ Chapitre 406" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "406": {
            "text": "❌ IMPASSE : Ton agressivité choque les passants. Camila, embarrassée, doit te ramener précipitamment à la maison. Tu as raté ton intégration.",
            "choices": [ { "text": "Le choc interculturel demande de la souplesse. Utilise ton Check-point.", "next": 404, "link_text": "→ Retour au Chapitre 404" } ],
            "conclusive": false, "has_menu_button": true
          },
          "408": {
            "text": "Camila apaise la vendeuse avec un sourire. Plus tard, assises sur un banc, elle t'explique le *jeitinho* (l'art de s'arranger) et te met en garde : « Ici on sourit, mais on ne dit pas tout. L'armée a des oreilles partout. Ne parle jamais de politique. »",
            "choices": [
              { "text": "Acquiescer et promettre de rester discrète.", "next": 410, "link_text": "→ Chapitre 410" },
              { "text": "Te disputer avec elle au nom de la liberté d'expression.", "next": 409, "link_text": "→ Chapitre 409" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "409": {
            "text": "❌ IMPASSE : En lui faisant la morale, tu lui prouves que tu es une étrangère ignorante des dangers réels. Elle refuse de t'en dire plus pour le reste de l'année.",
            "choices": [ { "text": "Écoute ceux qui connaissent le terrain. Utilise ton Check-point.", "next": 408, "link_text": "→ Retour au Chapitre 408" } ],
            "conclusive": false, "has_menu_button": true
          },
          "410": {
            "text": "C'est ton premier jour au lycée. L'uniforme est obligatoire. La barrière de la langue est un mur infranchissable : tu ne comprends pas un mot des professeurs, ce qui provoque en toi un profond sentiment d'isolement, typique du début d'échange AFS.",
            "choices": [
              { "text": "Aller dans la cour pour observer les autres élèves.", "next": 412, "link_text": "→ Chapitre 412" },
              { "text": "Fuir le lycée et rentrer pleurer chez ta famille d'accueil.", "next": 411, "link_text": "→ Chapitre 411" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "411": {
            "text": "❌ IMPASSE : En fuyant, tu laisses la barrière de la langue gagner. Ton comité AFS local est alerté et remet en question ta capacité d'adaptation.",
            "choices": [ { "text": "Reste forte face à l'adversité. Utilise ton Check-point.", "next": 410, "link_text": "→ Retour au Chapitre 410" } ],
            "conclusive": false, "has_menu_button": true
          },
          "412": {
            "text": "Dans la cour, ton regard est attiré par un petit groupe d'élèves aux discussions fiévreuses. Parmi eux, João. Ses yeux sombres sont habités par une urgence fascinante. Ils se taisent dès qu'un surveillant approche.",
            "choices": [
              { "text": "Détourner le regard poliment et attendre le week-end.", "next": 407, "link_text": "→ Chapitre 407" },
              { "text": "Les fixer avec insistance pour comprendre leur manège.", "next": 414, "link_text": "→ Chapitre 414" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "414": {
            "text": "❌ IMPASSE : Ton insistance attire l'attention des surveillants (souvent des informateurs). Le groupe de João se disperse, et tu es désormais fichée comme suspecte.",
            "choices": [ { "text": "La discrétion est vitale ici. Utilise ton Check-point.", "next": 412, "link_text": "→ Retour au Chapitre 412" } ],
            "conclusive": false, "has_menu_button": true
          },
          "407": {
            "text": "Le week-end arrive. Le comité AFS local organise un grand *churrasco* (barbecue) pour tous les étudiants internationaux et leurs familles d'accueil. L'odeur de la viande grillée emplit l'air.",
            "choices": [
              { "text": "T'y rendre pour essayer de rencontrer du monde.", "next": 415, "link_text": "→ Chapitre 415" },
              { "text": "Refuser d'y aller, prétextant la chaleur étouffante.", "next": 419, "link_text": "→ Chapitre 419" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "419": {
            "text": "❌ IMPASSE : En restant chez toi, tu manques l'occasion cruciale de t'intégrer au réseau local d'AFS. Ton aventure s'enlise.",
            "choices": [ { "text": "Saisis chaque opportunité de rencontre. Utilise ton Check-point.", "next": 407, "link_text": "→ Retour au Chapitre 407" } ],
            "conclusive": false, "has_menu_button": true
          },
          "415": {
            "text": "Au barbecue, les organisateurs AFS, stricts dans leurs chemises, font un discours ferme : « Vous êtes ici pour l'échange culturel. Zéro implication politique, c'est la règle stricte de neutralité d'AFS ! »",
            "choices": [
              { "text": "Écouter en silence et aller te servir au buffet.", "next": 420, "link_text": "→ Chapitre 420" },
              { "text": "Prendre la parole pour dire qu'être neutre, c'est être lâche.", "next": 416, "link_text": "→ Chapitre 416" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "416": {
            "text": "❌ IMPASSE : Ton esclandre brise les règles de l'association. Les bénévoles, craignant pour la sécurité de l'organisation au Brésil, te rapatrient en France.",
            "choices": [ { "text": "Il y a un temps pour parler et un temps pour écouter. Utilise ton Check-point.", "next": 415, "link_text": "→ Retour au Chapitre 415" } ],
            "conclusive": false, "has_menu_button": true
          },
          "420": {
            "text": "Près du buffet, loin du regard des bénévoles, tu remarques João et son groupe. Ils se passent discrètement des feuilles imprimées. João te remarque et te fait un signe imperceptible de la tête vers un manguier isolé.",
            "choices": [
              { "text": "Braver les règles et le rejoindre sous le manguier.", "next": 422, "link_text": "→ Chapitre 422" },
              { "text": "Aller dénoncer son manège suspect aux bénévoles AFS.", "next": 421, "link_text": "→ Chapitre 421" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "421": {
            "text": "❌ IMPASSE : Tu préviens les bénévoles. Le groupe de João est expulsé de la fête. Considérée comme une balance par les lycéens, tu es ostracisée.",
            "choices": [ { "text": "Parfois, la loyauté humaine prime. Utilise ton Check-point.", "next": 420, "link_text": "→ Retour au Chapitre 420" } ],
            "conclusive": false, "has_menu_button": true
          },
          "422": {
            "text": "Sous le manguier, l'air crépite. Dans un portugais hésitant, João t'avoue qu'ils sont des *secundaristas*, publiant un journal clandestin contre le régime. Le danger est mortel. Il te jauge pour voir si tu es digne de confiance.",
            "choices": [
              { "text": "Accepter de prouver que tu t'intéresses à son pays.", "next": 425, "link_text": "→ Chapitre 425" },
              { "text": "Rire nerveusement et dire que tu es juste là pour la plage.", "next": 423, "link_text": "→ Chapitre 423" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "423": {
            "text": "❌ IMPASSE : João te jette un regard méprisant. « Reste sur ta plage, la gringa. » Il tourne les talons définitivement.",
            "choices": [ { "text": "L'échange culturel, c'est refuser la superficialité. Utilise ton Check-point.", "next": 422, "link_text": "→ Retour au Chapitre 422" } ],
            "conclusive": false, "has_menu_button": true
          },
          "425": {
            "text": "<b>⭐ ÉNIGME HISTORIQUE :</b><br><br>João s'approche, sa voix n'est plus qu'un murmure : « Prouve-le. Quel est le nom du terrible décret institutionnel passé en 1968, qui a donné les pleins pouvoirs à l'armée et supprimé toutes nos libertés ? »",
            "choices": [
              { "text": "La Constitution libérale de 1988", "next": 426, "link_text": "→ Proposer cette réponse" },
              { "text": "L'Ato Institucional numéro 5 (ou AI-5)", "next": 432, "link_text": "→ Proposer cette réponse" },
              { "text": "Le Plan Real", "next": 426, "link_text": "→ Proposer cette réponse" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "426": {
            "text": "❌ IMPASSE : João soupire. « Tu ne connais rien à notre souffrance. » Tu es jugée inapte à partager leur secret.",
            "choices": [ { "text": "L'Histoire est la clé pour comprendre un peuple. Utilise ton Check-point.", "next": 425, "link_text": "→ Retour à l'énigme" } ],
            "conclusive": false, "has_menu_button": true
          },
          "432": {
            "text": "« L'AI-5... Exactement, » souffle João, impressionné. Il te sourit enfin. Les semaines passent. Tu es intégrée à leur cercle. Un soir, ils t'emmènent dans une cave insalubre où trône une ronéotypeuse usée, l'odeur d'encre est âcre.",
            "choices": [
              { "text": "Les aider à imprimer la prochaine édition du journal.", "next": 427, "link_text": "→ Chapitre 427" },
              { "text": "Refuser de toucher à la machine par peur de te salir.", "next": 428, "link_text": "→ Chapitre 428" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "428": {
            "text": "❌ IMPASSE : Ton attitude précieuse agace le groupe. Luciana, une des filles, exige ton renvoi de l'équipe.",
            "choices": [ { "text": "Mets les mains dans le cambouis. Utilise ton Check-point.", "next": 432, "link_text": "→ Retour au Chapitre 432" } ],
            "conclusive": false, "has_menu_button": true
          },
          "427": {
            "text": "Tu as les mains noires d'encre. João annonce le plan d'action de l'année : profiter du chaos sonore et visuel du grand Carnaval de Recife pour glisser leurs tracts anti-dictature dans les poches des fêtards.",
            "choices": [
              { "text": "Garder le secret absolu sur cette opération.", "next": 429, "link_text": "→ Chapitre 429" },
              { "text": "Tout avouer à Camila en rentrant pour te rassurer.", "next": 430, "link_text": "→ Chapitre 430" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "430": {
            "text": "❌ IMPASSE : Paniquée pour ta sécurité, Camila prévient ses parents qui alertent AFS. Tu es retirée du programme pour ta propre protection.",
            "choices": [ { "text": "Certains secrets sont trop lourds à partager. Utilise ton Check-point.", "next": 427, "link_text": "→ Retour au Chapitre 427" } ],
            "conclusive": false, "has_menu_button": true
          },
          "429": {
            "text": "Février arrive. La ville bouillonne. Le groupe se réunit pour préparer l'action. Il faut dissimuler des centaines de tracts sous les costumes exubérants du Carnaval.",
            "choices": [
              { "text": "Les aider à coudre des doubles-fonds dans les vêtements.", "next": 431, "link_text": "→ Chapitre 431" },
              { "text": "Paniquer et refuser de participer à la dernière minute.", "next": 434, "link_text": "→ Chapitre 434" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "434": {
            "text": "❌ IMPASSE : Ta lâcheté de dernière minute met tout le groupe en danger. Tu es définitivement bannie de leur cercle.",
            "choices": [ { "text": "Va jusqu'au bout de tes engagements. Utilise ton Check-point.", "next": 429, "link_text": "→ Retour au Chapitre 429" } ],
            "conclusive": false, "has_menu_button": true
          },
          "431": {
            "text": "Le jour J. La ville explose. Le *frevo* résonne à en faire trembler l'asphalte. Les trompettes hurlent, les petits parapluies colorés tourbillonnent. L'ambiance est enivrante, ruisselante de sueur et de paillettes. Tu es chargée de faire le guet.",
            "choices": [
              { "text": "Rester concentrée sur la foule pour protéger tes amis.", "next": 436, "link_text": "→ Chapitre 436" },
              { "text": "T'enivrer de la musique et aller danser au milieu de la foule.", "next": 433, "link_text": "→ Chapitre 433" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "433": {
            "text": "❌ IMPASSE : Emportée par les percussions, tu quittes ton poste. Une patrouille saisit les sacs du groupe. Tu as trahi leur confiance.",
            "choices": [ { "text": "Ne perds jamais ton objectif de vue. Utilise ton Check-point.", "next": 431, "link_text": "→ Retour au Chapitre 431" } ],
            "conclusive": false, "has_menu_button": true
          },
          "436": {
            "text": "Tu restes vigilante. Le groupe distribue les tracts avec une agilité incroyable. Les feuilles subversives glissent dans les poches des passants à leur insu.",
            "choices": [
              { "text": "Continuer à observer les allées et venues de la police.", "next": 437, "link_text": "→ Chapitre 437" },
              { "text": "Prendre un tract et le donner directement à un homme en costume.", "next": 438, "link_text": "→ Chapitre 438" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "438": {
            "text": "❌ IMPASSE : L'homme en costume était un agent du DOPS en civil. Il t'arrête sur-le-champ. Fin du jeu.",
            "choices": [ { "text": "Laisse les locaux gérer l'action directe. Utilise ton Check-point.", "next": 436, "link_text": "→ Retour au Chapitre 436" } ],
            "conclusive": false, "has_menu_button": true
          },
          "437": {
            "text": "Au crépuscule, le cauchemar frappe. Les rires sont couverts par le crissement terrifiant des pneus d'une camionnette *Veraneio* banalisée. Des hommes en civil (le DOPS) surgissent de la foule pétrifiée et foncent droit sur João.",
            "choices": [
              { "text": "Te cacher dans la foule, tétanisée.", "next": 439, "link_text": "→ Chapitre 439" },
              { "text": "Attaquer les agents à mains nues pour sauver João.", "next": 440, "link_text": "→ Chapitre 440" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "440": {
            "text": "❌ IMPASSE : Ton geste héroïque mais suicidaire te vaut d'être jetée dans la camionnette avec lui. Disparue dans les geôles du régime.",
            "choices": [ { "text": "La survie prime. Utilise ton Check-point.", "next": 437, "link_text": "→ Retour au Chapitre 437" } ],
            "conclusive": false, "has_menu_button": true
          },
          "439": {
            "text": "En une poignée de secondes, ils attrapent João, le plaquent au sol, le jettent à l'arrière du véhicule et disparaissent. Le silence glacé qui tombe sur la rue est suffocant. Le groupe s'est dispersé.",
            "choices": [
              { "text": "Fuir à travers les ruelles jusqu'à ta maison d'accueil.", "next": 441, "link_text": "→ Chapitre 441" },
              { "text": "Aller au commissariat pour témoigner de son innocence.", "next": 442, "link_text": "→ Chapitre 442" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "442": {
            "text": "❌ IMPASSE : La police politique n'accepte pas les témoins. Tu es immédiatement interrogée, suspectée et expulsée du pays par les autorités.",
            "choices": [ { "text": "Ne sois pas naïve face à une dictature. Utilise ton Check-point.", "next": 439, "link_text": "→ Retour au Chapitre 439" } ],
            "conclusive": false, "has_menu_button": true
          },
          "441": {
            "text": "Tu rentres chez les Bauer, le souffle court, terrifiée. Camila comprend immédiatement qu'il s'est passé quelque chose de grave. Quand la police vient frapper à la porte pour contrôler les étrangers du quartier, elle ment pour te couvrir.",
            "choices": [
              { "text": "Accepter sa protection et te cacher dans ta chambre.", "next": 443, "link_text": "→ Chapitre 443" },
              { "text": "Faire tes valises et fuir par la fenêtre.", "next": 444, "link_text": "→ Chapitre 444" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "444": {
            "text": "❌ IMPASSE : En fuyant en pleine rue la nuit, tu es arrêtée par une patrouille militaire lors du couvre-feu.",
            "choices": [ { "text": "Fais confiance à ta famille d'accueil. Utilise ton Check-point.", "next": 441, "link_text": "→ Retour au Chapitre 441" } ],
            "conclusive": false, "has_menu_button": true
          },
          "443": {
            "text": "Le lendemain, tu trouves un mot glissé sous la porte de ton casier au lycée : *\"Réunion d'urgence à minuit, dans la cave. Il y a une taupe.\"*",
            "choices": [
              { "text": "T'y rendre pour comprendre ce qui s'est passé.", "next": 445, "link_text": "→ Chapitre 445" },
              { "text": "Ignorer le mot par peur des conséquences.", "next": 446, "link_text": "→ Chapitre 446" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "446": {
            "text": "❌ IMPASSE : Ton absence valides les soupçons du groupe qui te condamne. Ta famille d'accueil contacte AFS pour te rapatrier d'urgence.",
            "choices": [ { "text": "Fais face à la tempête. Utilise ton Check-point.", "next": 443, "link_text": "→ Retour au Chapitre 443" } ],
            "conclusive": false, "has_menu_button": true
          },
          "445": {
            "text": "Minuit. Dans la cave insalubre, l'air est irrespirable. Neuf visages creusés par l'angoisse t'attendent. Pedro frappe du poing : « Les flics savaient exactement où João serait ! » Luciana se lève brutalement, le doigt braqué sur toi : « C'est la *gringa* ! Elle l'a vendu pour sauver sa peau ! »",
            "choices": [
              { "text": "Défendre ton innocence en retournant la situation avec logique.", "next": 461, "link_text": "→ Chapitre 461" },
              { "text": "Fondre en larmes et hurler que tu es innocente.", "next": 462, "link_text": "→ Chapitre 462" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "462": {
            "text": "❌ IMPASSE : Tes larmes et ta panique sont interprétées comme des aveux de culpabilité. Face à l'hostilité du groupe, tu dois fuir pour ta vie.",
            "choices": [ { "text": "Garde ton sang-froid. Utilise ton Check-point.", "next": 445, "link_text": "→ Retour au Chapitre 445" } ],
            "conclusive": false, "has_menu_button": true
          },
          "461": {
            "text": "La gorge sèche, tu ravales ta peur. Avec ton portugais rocailleux mais précis, tu exiges d'analyser les faits. Tu pointes les incohérences de Luciana qui affirme t'avoir vue près d'une voiture de police, alors qu'elle disait être à l'autre bout de la place.",
            "choices": [
              { "text": "Continuer à l'acculer par la logique.", "next": 484, "link_text": "→ Chapitre 484" },
              { "text": "La gifler pour son mensonge éhonté.", "next": 485, "link_text": "→ Chapitre 485" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "485": {
            "text": "❌ IMPASSE : La violence physique retourne le groupe entier contre toi. La bagarre éclate et ton innocence n'est jamais prouvée.",
            "choices": [ { "text": "Garde l'avantage intellectuel. Utilise ton Check-point.", "next": 461, "link_text": "→ Retour au Chapitre 461" } ],
            "conclusive": false, "has_menu_button": true
          },
          "484": {
            "text": "Le silence de mort s'installe. Tu te remémores soudain des détails enfouis du Carnaval : la veille de l'arrestation, João t'avait prise par la taille pour danser. À cet instant, tu avais croisé un regard noir dans la foule, un visage crispé par une jalousie dévorante.",
            "choices": [
              { "text": "Mener l'interrogatoire final des filles du groupe.", "next": 486, "link_text": "→ Chapitre 486" },
              { "text": "Accuser Pedro, le chef du groupe, au hasard.", "next": 487, "link_text": "→ Chapitre 487" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "487": {
            "text": "❌ IMPASSE : Ton accusation hasardeuse contre le leader indéfectible détruit ta crédibilité. Tu es jetée dehors.",
            "choices": [ { "text": "Ne tire pas de conclusions hâtives. Utilise ton Check-point.", "next": 484, "link_text": "→ Retour au Chapitre 484" } ],
            "conclusive": false, "has_menu_button": true
          },
          "486": {
            "text": "<b>⭐ ÉNIGME FINALE (DIALOGUES) :</b><br><br>L'atmosphère de la cave est à couper au couteau. Tu observes les filles du groupe. Mariana a le regard fuyant, les épaules rentrées. Teresa se mord les lèvres jusqu'au sang. Luciana te dévisage, la poitrine haletante, les poings serrés de colère. Tout s'éclaire. L'une d'elles aimait João en secret. Dans un acte de désespoir destructeur, elle a dénoncé João, espérant te faire porter le chapeau pour que les militaires te renvoient en France.<br><br>Qui accuses-tu formellement devant le groupe ?",
            "choices": [
              { "text": "Teresa, car son silence et sa nervosité sont des aveux clairs.", "next": 496, "link_text": "→ Accuser Teresa" },
              { "text": "Mariana, car elle refuse de croiser ton regard depuis le début.", "next": 496, "link_text": "→ Accuser Mariana" },
              { "text": "Luciana, car son agressivité sert d'écran de fumée à sa jalousie.", "next": 497, "link_text": "→ Accuser Luciana" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "496": {
            "text": "❌ IMPASSE : Ton accusation tombe à plat. La fille que tu pointes du doigt fond en larmes, détruite. La vraie coupable sourit dans l'ombre.",
            "choices": [ { "text": "Réfléchis aux regards échangés pendant le Carnaval. Utilise ton Check-point.", "next": 486, "link_text": "→ Retour à l'énigme" } ],
            "conclusive": false, "has_menu_button": true
          },
          "497": {
            "text": "« C'est toi, Luciana, » lâches-tu d'une voix glaciale. Luciana blêmit brutalement. Sous la pression de Pedro qui se lève, elle craque. Elle s'effondre à genoux, hurlant en sanglots qu'elle voulait juste que la police te repère, toi la Française, pour que tu sois expulsée, et qu'elle ne pensait pas qu'ils prendraient João. Le groupe, écœuré par cette trahison, s'écarte d'elle.",
            "choices": [
              { "text": "Découvrir la conclusion A : L'Éveil Politique", "next": 500, "link_text": "→ Finale A" },
              { "text": "Découvrir la conclusion B : Le Bouclier Diplomatique", "next": 501, "link_text": "→ Finale B" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "500": {
            "text": "🌟 FINALE GAGNANTE A (L'Éveil Politique) <br><br>Ton esprit d'analyse t'a sauvée. Le groupe s'organise avec Camila, ta sœur d'accueil qui se révèle être une alliée secrète, pour te protéger des répercussions policières. Luciana est définitivement bannie. Cette expérience t'a brutalement arrachée à ta naïveté d'adolescente : cet échange AFS au Brésil ne t'a pas seulement appris la langue, il t'a confrontée à la dure et violente réalité des luttes pour la liberté dans le monde.",
            "choices": [],
            "conclusive": true, "has_menu_button": true
          },
          "501": {
            "text": "🌟 FINALE GAGNANTE B (Le Bouclier Diplomatique) <br><br>Innocentée, tu refuses catégoriquement de fuir au chaud. Puisque les militaires ciblent en priorité les jeunes Brésiliens, tu décides, avec l'aide secrète de quelques bénévoles AFS révoltés, que ton passeport étranger deviendra leur bouclier. Tu passes le reste de ton année à aider secrètement le mouvement *secundarista* à alerter l'international, médiatisant l'arrestation de João depuis la France. Tu as transformé ton choc culturel en un véritable acte de solidarité humaniste indéfectible.",
            "choices": [],
            "conclusive": true, "has_menu_button": true
          },
          



          /* ================================================================= */
          /* INTRIGUE 5 : LE CARNET DU BATAILLON (NOUVELLE-ZÉLANDE)            */
          /* ================================================================= */

          "9": {
            "text": "<b>AOÛT 2005</b><br><br>Tu incarnes Lucas, 17 ans. Ta bourse AFS t'a conduit à l'autre bout du monde : Gisborne, sur la côte est de la Nouvelle-Zélande. Dès ta descente du bus, le choc thermique et culturel est brutal. Le vent glacial de l'hiver austral te fouette le visage, charriant des odeurs d'embruns salés et de terre humide. Tu es accueilli dans une ferme isolée, entourée d'immenses collines verdoyantes piquetées de milliers de moutons. Aroha, ta sœur d'accueil, t'accueille avec un sourire chaleureux et lumineux. En revanche, son frère aîné, Tama, un jeune homme à la carrure imposante, reste en retrait. Les bras croisés, il te lance un regard sombre et perçant. Pour lui, la plupart des *Pākehā* (Européens) ne viennent que pour photographier et s'approprier leur culture millénaire.",
            "choices": [
              { "text": "Proposer immédiatement ton aide pour les travaux difficiles de la ferme.", "next": 328, "link_text": "→ Chapitre 328" },
              { "text": "T'isoler dans ta chambre, intimidé par l'hostilité de Tama.", "next": 102, "link_text": "→ Chapitre 102" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "102": {
            "text": "❌ IMPASSE : En t'enfermant dans ta chambre, tu n'entends que le sifflement du vent contre les vitres. Tama, te jugeant paresseux et distant, refuse désormais de t'adresser la parole. Le fossé se creuse irrémédiablement et ton échange devient un échec d'intégration.",
            "choices": [ { "text": "L'intégration exige de sortir de sa zone de confort. Utilise ton Check-point.", "next": 9, "link_text": "→ Retour au Chapitre 9" } ],
            "conclusive": false, "has_menu_button": true
          },
          "328": {
            "text": "Malgré la fatigue écrasante du décalage horaire, tu chausses de lourdes bottes et tu te retrousses les manches dans la boue froide. Pendant des heures, tu aides à rentrer les moutons, les mains écorchées par la laine brute et les clôtures. Aroha t'observe, visiblement impressionnée par ta résilience. Tama, essuyant la sueur de son front, se contente de grogner que « c'est la moindre des choses », mais son regard s'est très légèrement adouci. Quelques jours plus tard, une effervescence s'empare de la communauté : de grands travaux sont annoncés.",
            "choices": [
              { "text": "Te proposer pour aider à rénover le *Marae* (la maison commune sacrée).", "next": 895, "link_text": "→ Chapitre 895" },
              { "text": "Défier Tama en lui disant qu'il devrait être plus reconnaissant pour ton aide.", "next": 741, "link_text": "→ Chapitre 741" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "741": {
            "text": "❌ IMPASSE : Ton ton suffisant et ta demande de gratitude heurtent de plein fouet les codes locaux. L'humilité est reine ici. Outré, Tama t'exclut totalement des activités de la communauté.",
            "choices": [ { "text": "Le don de soi n'attend pas de merci. Utilise ton Check-point.", "next": 328, "link_text": "→ Retour au Chapitre 328" } ],
            "conclusive": false, "has_menu_button": true
          },
          "895": {
            "text": "Le *Marae* est un bâtiment majestueux, dont les boiseries (*whakairo*) racontent l'histoire des ancêtres. À l'intérieur, l'air sent la sciure, le vieux bois et la cire. Tu aides silencieusement à poncer le plancher. Soudain, en soulevant une latte pourrissante dans un coin sombre, tes doigts heurtent un objet dur. Tu dégages une petite boîte en bois, magnifiquement sculptée mais couverte de toiles d'araignées. Aroha, qui ponçait avec toi, vient juste de sortir chercher de l'eau à l'extérieur.",
            "choices": [
              { "text": "Attendre le retour d'Aroha pour lui montrer ta découverte.", "next": 562, "link_text": "→ Chapitre 562" },
              { "text": "Ouvrir la boîte immédiatement par curiosité.", "next": 18, "link_text": "→ Chapitre 18" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "18": {
            "text": "❌ IMPASSE : Le couvercle grince. En l'ouvrant seul, sans autorisation, tu brises le *Tapu*, le caractère sacré de l'objet et du lieu. Un ancien te surprend. Choqué par ta profanation, le conseil demande ton départ du village.",
            "choices": [ { "text": "Respecte ce que tu ne comprends pas encore. Utilise ton Check-point.", "next": 895, "link_text": "→ Retour au Chapitre 895" } ],
            "conclusive": false, "has_menu_button": true
          },
          "562": {
            "text": "À son retour, tu montres la boîte à Aroha. Avec une infinie précaution, elle soulève le couvercle. À l'intérieur repose un épais carnet en cuir craquelé, dont l'odeur de vieux papier emplit l'air. « C'est celui de Hemi... notre arrière-grand-père, soldat du célèbre 28e Bataillon maori ! » murmure-t-elle, les yeux ronds. À cet instant précis, la lourde porte du *Marae* s'ouvre avec fracas. Tama se dresse dans l'encadrement, sa silhouette massive bloquant la lumière du soleil. En voyant un étranger si près d'une relique familiale, son visage se crispe de fureur. Il s'avance à grands pas et exige que tu lui remettes la boîte.",
            "choices": [
              { "text": "Lui rendre la boîte respectueusement, tête baissée, sans un mot.", "next": 143, "link_text": "→ Chapitre 143" },
              { "text": "Refuser de la lâcher en affirmant que c'est ta découverte.", "next": 977, "link_text": "→ Chapitre 977" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "977": {
            "text": "❌ IMPASSE : Les yeux noirs de colère, Tama te l'arrache violemment des mains. Pour lui, tu n'es qu'un pilleur culturel de plus qui se croit tout permis. Tu perds leur confiance à jamais.",
            "choices": [ { "text": "La propriété est relative face au sacré. Utilise ton Check-point.", "next": 562, "link_text": "→ Retour au Chapitre 562" } ],
            "conclusive": false, "has_menu_button": true
          },
          "143": {
            "text": "Tu recules d'un pas, baisses humblement la tête et lui tends la boîte avec douceur. Stupéfait par ton absence d'arrogance, Tama s'arrête. Il prend la boîte, l'ouvre, et effleure les pages jaunies du bout de ses doigts calleux. Mais sa mâchoire se serre. « Je... je ne peux pas le lire, » finit-il par avouer, la voix brisée par la frustration. « Une grande partie est écrite en français, avec de l'argot militaire européen. »",
            "choices": [
              { "text": "Offrir humblement de l'aider à traduire les passages.", "next": 367, "link_text": "→ Chapitre 367" },
              { "text": "Exiger qu'il s'excuse pour son comportement avant de l'aider.", "next": 848, "link_text": "→ Chapitre 848" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "848": {
            "text": "❌ IMPASSE : Cette vision transactionnelle et rancunière de l'aide le dégoûte profondément. L'échange culturel n'est pas un chantage. Il claque la porte et s'en va seul.",
            "choices": [ { "text": "Le don de soi doit être désintéressé. Utilise ton Check-point.", "next": 143, "link_text": "→ Retour au Chapitre 143" } ],
            "conclusive": false, "has_menu_button": true
          },
          "367": {
            "text": "Le soir venu, sous la lueur chaude de la lampe de la cuisine, vous êtes tous les trois penchés sur la table en formica. Tu déchiffres l'écriture cursive et délavée. Le carnet raconte l'histoire poignante de Hemi en Europe (en 1944), et sa rencontre inespérée avec un ambulancier volontaire de l'AFS qui l'a soigné sous les bombes. Au détour d'un paragraphe glaçant, tu tombes sur un mot en *Te Reo* (la langue maorie), tracé en lettres majuscules et souligné trois fois par Hemi.",
            "choices": [
              { "text": "T'arrêter de lire et demander la signification du mot *Whānau* avec sincérité.", "next": 56, "link_text": "→ Chapitre 56" },
              { "text": "Ignorer le mot maori et sauter rapidement à la page suivante.", "next": 722, "link_text": "→ Chapitre 722" }
            ],
            "conclusive": false, "has_menu_button": true
          },
          "722": {
            "text": "❌ IMPASSE : En ignorant la langue de tes hôtes, tu leur montres un désintérêt profond pour ce qu'ils sont. Tama referme le carnet. Tu resteras un simple visiteur superficiel.",
            "choices": [ { "text": "La langue est l'âme d'une culture. Utilise ton Check-point.", "next": 367, "link_text": "→ Retour au Chapitre 367" } ],
            "conclusive": false, "has_menu_button": true
          },
          "56": {
